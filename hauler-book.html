<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>マイ予約｜あおぞら予ろシク</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/pwa.css">
</head>
<body class="pwa-body">
  <div class="pwa" data-screen="book" data-title="マイ予約" data-sub="サンプル建材株式会社">
    <main class="pwa-content">
      <div class="flex" style="gap:8px;margin-bottom:14px">
        <div class="m-card" style="flex:1;margin:0;text-align:center;padding:12px"><div class="td-sub">承認待ち</div><div class="mono" style="font-size:22px;font-weight:800;color:var(--warn-ink)" id="sReq">0</div></div>
        <div class="m-card" style="flex:1;margin:0;text-align:center;padding:12px"><div class="td-sub">確定</div><div class="mono" style="font-size:22px;font-weight:800;color:var(--ok-ink)" id="sFix">0</div></div>
        <div class="m-card" style="flex:1;margin:0;text-align:center;padding:12px"><div class="td-sub">取消</div><div class="mono" style="font-size:22px;font-weight:800;color:var(--muted)" id="sCan">0</div></div>
      </div>
      <div class="m-section-label">予約一覧</div>
      <div id="list"></div>
    </main>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/pwa.js"></script>
  <script>
  (function () {
    const R = DATA.haulerRes;
    sReq.textContent = R.filter(r=>r.status==="request"||r.status==="new").length;
    sFix.textContent = R.filter(r=>r.status==="fixed").length;
    sCan.textContent = R.filter(r=>r.status==="cancel").length;
    list.innerHTML = R.map((r,i) => `
      <div class="m-row" style="${r.status==='cancel'?'opacity:.55':''}">
        <div class="m-when"><div class="d">${r.date.slice(8)}</div><div class="a">${r.date.slice(5,7)}月 ${r.ampm}</div></div>
        <div class="m-body">
          <div class="t">${r.emitter}</div>
          <div class="s">${r.site}</div>
          <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${UI.pill(r.status)}
            <span class="td-sub mono">${UI.waste(r.waste)} ・ ${r.car}×${r.units}</span></div>
          ${r.status!=="cancel" ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px" data-i="${i}">取消を依頼</button>` : ""}
        </div>
      </div>`).join("");
    list.addEventListener("click", e => {
      const b = e.target.closest("[data-i]"); if (!b) return;
      const r = R[+b.dataset.i];
      toast("取消依頼を施設へ送信しました", "default");
      if (window.pwaNotify) pwaNotify("取消依頼を送信しました", `${r.date.slice(5)} ${r.ampm} の取消を依頼しました。施設の承認をお待ちください。`, "hauler-book.html", "request");
    });
  })();
  </script>
</body>
</html>
