<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>品目マスター｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
  .row-actions { display:flex; gap:6px; }
  .muted-row { opacity:.55; }
  .lim-tag { font-size:11px; }
</style>
</head>
<body>
<div class="layout" data-app="aozora" data-screen="item" data-role="管理者"
     data-company="株式会社あおぞら" data-title="基本情報 ／ 品目マスター" data-date="2026-06-25 (木)">
  <main class="main"><div class="page">
    <div class="page-head"><h1 class="page-title">品目マスター</h1>
      <p class="page-sub">取り扱う産業廃棄物の品目を管理します。品目ごとに「受入量を何で数えるか（制限項目）」を紐づけられます。</p></div>

    <div class="toolbar">
      <input class="input" id="q" placeholder="品目名・略称・コードで検索" style="max-width:320px;flex:1" aria-label="検索">
      <label class="check"><input type="checkbox" id="onlyAccept"> 受入可のみ表示</label>
      <div class="grow"></div>
      <a class="btn" href="aozora-limits.html">制限項目マスターへ</a>
      <button class="btn btn-primary" id="addBtn">＋ 新規追加</button>
    </div>

    <div class="card card-pad">
      <div class="list-meta" style="padding:14px 16px 0"><span class="td-sub mono" id="meta"></span></div>
      <div class="table-wrap"><table class="tbl">
        <thead><tr><th class="col-actions">操作</th><th>品目コード</th><th>品目名</th><th>略称</th><th>単位</th><th>受入</th><th>受入量の数え方</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
    <p class="hint" style="margin-top:10px">※ 「受入量の数え方」で選んだ制限項目が、カレンダーの「この日の設定」に上限入力欄として並びます。</p>
  </div></main>
</div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function () {
  const UNITS = ["kg", "t", "m3", "L", "枚", "台", "本", "個"];
  let q = "", onlyAccept = false;

  const limName = id => { const l = DATA.limitDefs.find(x => x.id === id); return l ? `${l.name}（${l.unit}）` : null; };

  function filtered() {
    const k = q.trim().toLowerCase();
    return DATA.items.filter(it => {
      if (onlyAccept && !it.accept) return false;
      if (!k) return true;
      return [it.name, it.short, it.code].join(" ").toLowerCase().includes(k);
    });
  }

  function render() {
    const list = filtered();
    document.getElementById("meta").textContent = `データ数：${list.length} / ${DATA.items.length}`;
    document.getElementById("rows").innerHTML = list.map(it => {
      const i = DATA.items.indexOf(it), lim = limName(it.limitId);
      return `<tr data-i="${i}" class="${it.accept ? "" : "muted-row"}">
        <td class="col-actions"><div class="row-actions">
          <button class="btn btn-ghost btn-sm act-edit" data-i="${i}">編集</button>
          <button class="btn btn-ghost btn-sm act-del" data-i="${i}" style="color:var(--bad-ink)">削除</button>
        </div></td>
        <td class="td-mono">${it.code}</td>
        <td class="td-strong">${it.name}</td>
        <td>${it.short || "—"}</td>
        <td class="td-mono">${it.unit}</td>
        <td>${it.accept
          ? `<span class="pill pill-ok"><span class="dot"></span>受入可</span>`
          : `<span class="pill pill-neutral"><span class="dot"></span>停止中</span>`}</td>
        <td>${lim ? `<span class="pill pill-brand lim-tag"><span class="dot"></span>${lim}</span>`
                  : `<span class="td-sub">数量制限なし</span>`}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="7"><div class="empty"><h3>該当する品目がありません</h3><p>検索条件を変えてお試しください。</p></div></td></tr>`;
  }

  function editDrawer(i) {
    const it = i != null ? DATA.items[i] : { code:"", name:"", short:"", unit:"kg", limitId:null, accept:true };
    const autoCode = it.code || ("I" + String(DATA.items.length + 1).padStart(2, "0"));
    const limOpts = `<option value="">数量制限なし</option>` + DATA.limitDefs
      .map(l => `<option value="${l.id}" ${it.limitId === l.id ? "selected" : ""}>${l.name}（${l.unit}）${l.active ? "" : " ※無効"}</option>`).join("");
    openDrawer(`
      <div class="drawer-head"><div style="flex:1"><div class="tb-crumb">品目マスター</div>
        <h2 style="font-size:18px;margin-top:2px">${i != null ? "品目を編集" : "品目を新規登録"}</h2></div>
        <button class="icon-btn" data-close>${ICONS.x}</button></div>
      <div class="drawer-body">
        <div class="form-grid">
          <div class="field"><label class="label">品目コード <span class="req">必須</span></label><input class="input td-mono" id="f-code" value="${autoCode}"></div>
          <div class="field"><label class="label">単位</label><select class="select" id="f-unit">${UNITS.map(u => `<option ${u === it.unit ? "selected" : ""}>${u}</option>`).join("")}</select></div>
          <div class="field col-2"><label class="label">品目名 <span class="req">必須</span></label><input class="input" id="f-name" value="${it.name}"></div>
          <div class="field col-2"><label class="label">略称 <span class="opt">任意</span></label><input class="input" id="f-short" value="${it.short || ""}"><span class="hint">一覧やカレンダーで使う短い表記</span></div>
          <div class="field col-2"><label class="label">受入量の数え方</label><select class="select" id="f-limit">${limOpts}</select>
            <span class="hint">この品目の受入残をどの制限項目で管理するかを選びます。項目は<b>制限項目マスター</b>で追加できます。</span></div>
        </div>
        <div class="divider"></div>
        <label class="check"><input type="checkbox" id="f-accept" ${it.accept ? "checked" : ""}> この品目の受入を受け付ける</label>
        <p class="hint" style="margin-top:7px">チェックを外すと、予約者の申請画面の選択肢から外れます（過去データは残ります）。</p>
      </div>
      <div class="drawer-foot">
        <button class="btn" style="flex:1" data-close>キャンセル</button>
        <button class="btn btn-primary" style="flex:1" id="saveBtn">${i != null ? "保存する" : "登録する"}</button>
      </div>`);
    document.getElementById("saveBtn").addEventListener("click", () => {
      const g = id => document.getElementById(id).value.trim();
      if (!g("f-code") || !g("f-name")) { toast("品目コードと品目名は必須です", "bad"); return; }
      const rec = { code:g("f-code"), name:g("f-name"), short:g("f-short"), unit:g("f-unit"),
        limitId: g("f-limit") || null, accept: document.getElementById("f-accept").checked };
      if (i != null) DATA.items[i] = rec; else DATA.items.push(rec); DATA.saveMaster();
      closeDrawer(); render(); toast(i != null ? "品目を保存しました" : "品目を登録しました", "ok");
    });
  }

  document.getElementById("rows").addEventListener("click", e => {
    const ed = e.target.closest(".act-edit"), del = e.target.closest(".act-del"), tr = e.target.closest("tr[data-i]");
    if (del) { const i = +del.dataset.i;
      if (confirm(`「${DATA.items[i].name}」を削除しますか？`)) { DATA.items.splice(i, 1); render(); DATA.saveMaster(); toast("品目を削除しました", "default"); } return; }
    if (ed) { editDrawer(+ed.dataset.i); return; }
    if (tr) editDrawer(+tr.dataset.i);
  });
  document.getElementById("addBtn").addEventListener("click", () => editDrawer(null));
  document.getElementById("q").addEventListener("input", e => { q = e.target.value; render(); });
  document.getElementById("onlyAccept").addEventListener("change", e => { onlyAccept = e.target.checked; render(); });
  render();
})();
</script>
</body></html>
