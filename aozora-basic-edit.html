<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>基本情報の編集｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">

</head>
<body>
<div class="layout" data-app="aozora" data-screen="basic" data-role="管理者"
     data-company="株式会社あおぞら" data-title="基本情報の編集" data-date="2026-06-24 (水)">
  <main class="main"><div class="page">
    <div class="page-head flex" style="gap:12px">
      <a class="icon-btn" href="aozora-basic.html" aria-label="戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
      <div><h1 class="page-title" id="ttl">編集</h1><p class="page-sub" id="sub">搬入予約登録時に選択候補として表示されます。</p></div>
    </div>
    <form class="card" onsubmit="return false" style="max-width:720px">
      <div class="card-body">
        <div class="form-section">
          <div class="form-section-title"><span class="n">1</span><span id="secLabel">基本情報</span></div>
          <div class="form-grid">
            <div class="field col-2"><label class="label" id="lblName">名称 <span class="req">必須</span></label><input class="input" id="fName"></div>
            <div class="field" id="contactWrap"><label class="label">担当者 <span class="opt">任意</span></label><input class="input" id="fContact"></div>
            <div class="field"><label class="label">電話番号 <span class="opt">任意</span></label><input class="input mono" id="fTel"></div>
            <div class="field col-2"><label class="label">メモ <span class="opt">任意</span></label><textarea class="textarea" placeholder="社内連絡事項・注意点など"></textarea></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="form-section">
          <div class="form-section-title"><span class="n">2</span>実績</div>
          <div class="flex" style="gap:24px">
            <div><div class="td-sub">これまでの予約</div><div class="mono" style="font-size:22px;font-weight:800" id="fCount">—</div></div>
            <div><div class="td-sub">状態</div><div style="margin-top:6px"><span class="pill pill-ok"><span class="dot"></span>取引中</span></div></div>
          </div>
        </div>
      </div>
      <div class="drawer-foot" style="border-radius:0 0 var(--r-lg) var(--r-lg)">
        <button class="btn btn-primary" id="save">変更を保存</button>
        <a class="btn btn-ghost" href="aozora-basic.html">取り消す</a>
        <div style="flex:1"></div>
        <button class="btn btn-danger" id="del">削除</button>
      </div>
    </form>
  </div></main>
</div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const type = q.get("type") === "emitter" ? "emitter" : "carrier";
  const i = parseInt(q.get("i") || "0", 10);
  const isCarrier = type === "carrier";
  const rec = (isCarrier ? DATA.carriers : DATA.emitters)[i] || (isCarrier ? DATA.carriers : DATA.emitters)[0];
  document.getElementById("ttl").textContent = (isCarrier ? "運搬業者" : "排出事業者") + "の編集";
  document.getElementById("secLabel").textContent = isCarrier ? "運搬業者の情報" : "排出事業者の情報";
  document.getElementById("lblName").innerHTML = (isCarrier ? "運搬業者名" : "排出事業者名") + ' <span class="req">必須</span>';
  document.getElementById("fName").value = rec.name;
  document.getElementById("fTel").value = rec.tel;
  document.getElementById("fCount").textContent = rec.count + " 件";
  if (isCarrier) document.getElementById("fContact").value = rec.contact || "";
  else document.getElementById("contactWrap").style.display = "none";
  document.getElementById("save").addEventListener("click", () => { toast((isCarrier ? "運搬業者" : "排出事業者") + "を保存しました", "ok"); setTimeout(() => location.href = "aozora-basic.html", 800); });
  document.getElementById("del").addEventListener("click", () => toast("削除は確認のうえ実行します（デモ）", "bad"));
})();
</script>
</body></html>
