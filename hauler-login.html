<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2722">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>ログイン｜運搬業者ポータル</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { min-height:100vh; display:grid; place-items:center; background:linear-gradient(150deg,#0c2722,#0a201c 60%,#0e3a30); padding:24px; }
  .login { width:min(420px,100%); background:var(--surface); border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.35); padding:34px; }
  .login .brand-mark { width:46px; height:46px; font-size:20px; margin-bottom:16px; }
  .login h1 { font-size:21px; } .login .sub { color:var(--muted); font-size:13px; margin:4px 0 22px; }
  .login .field { margin-bottom:14px; }
  .login .forgot { font-size:12px; color:var(--brand-strong); display:inline-block; margin-bottom:18px; }
  .login .foot { margin-top:18px; text-align:center; color:var(--muted); font-size:11px; }
</style>
</head>
<body>
  <div class="login">
    <div class="brand-mark">E</div>
    <h1>運搬業者ポータル</h1>
    <div class="sub">あおぞらへの搬入予約の申請（運搬業者向け）</div>
    <div class="field"><label class="label">ID または メールアドレス</label><input class="input" value="user@example.com"></div>
    <div class="field"><label class="label">パスワード</label><input class="input" type="password" value="****"></div>
    <a class="forgot" onclick="toast('パスワード再設定（デモ）','default')">パスワードを忘れた場合はこちら</a>
    <button class="btn btn-primary btn-lg" style="width:100%" onclick="location.href='hauler-home.html'">ログイン</button>
    <div class="foot">アカウントの登録が必要な方は、あおぞら事務所までお問い合わせください。<br>TEL：03-0000-0000 ／ office@example.com<br>v3.0 リデザイン提案 — エクオ株式会社</div>
  </div>
  <script src="assets/app.js"></script>
</body></html>
