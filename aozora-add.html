<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搬入予約登録｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">

</head>
<body>
<div class="layout" data-app="aozora" data-screen="add" data-role="管理者"
     data-company="株式会社あおぞら" data-title="搬入予約登録" data-date="2026-06-24 (水)">
  <main class="main">
    <div class="page">
      <div class="page-head flex" style="gap:12px">
        <a class="icon-btn" href="aozora-home.html" aria-label="戻る">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="18" height="18"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
        <div><h1 class="page-title">搬入予約登録</h1>
          <p class="page-sub">必須項目だけで素早く。品目は複数行で追加できます。</p></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start">
        <!-- form -->
        <form class="card" id="form" onsubmit="return false">
          <div class="card-body">
            <div class="form-section">
              <div class="form-section-title"><span class="n">1</span>基本情報</div>
              <div class="form-grid">
                <div class="field"><label class="label">予約者 <span class="req">必須</span></label>
                  <select class="select"><option>みらい建設 山田太郎</option><option>多摩運輸 佐藤</option><option>城北重機 鈴木</option></select></div>
                <div class="field"><label class="label">運搬業者 <span class="req">必須</span></label>
                  <input class="input" placeholder="例：サンプル建材株式会社"></div>
                <div class="field"><label class="label">予定日 <span class="req">必須</span></label>
                  <select class="select" id="fDate"><option>2026-06-22</option><option>2026-06-23</option><option selected>2026-06-25</option><option>2026-06-26</option><option>2026-06-27</option></select></div>
                <div class="field"><label class="label">搬入予定時間 <span class="req">必須</span></label>
                  <select class="select" id="fAmpm"><option value="am" selected>AM</option><option value="pm">PM</option></select></div>
                <div class="field"><label class="label">排出事業者 <span class="req">必須</span></label>
                  <input class="input" id="fEmitter" placeholder="例：みらい建設株式会社"></div>
                <div class="field"><label class="label">排出事業場（工事名）<span class="req">必須</span></label>
                  <input class="input" id="fSite" placeholder="例：みらい建設 解体現場">
                  <label class="check" style="margin-top:2px"><input type="checkbox" id="sameAs"> 排出事業者と同じ</label></div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="form-section">
              <div class="form-section-title"><span class="n">2</span>廃棄物</div>
              <label class="label" style="margin-bottom:8px">産業廃棄物種類 <span class="req">必須</span></label>
              <div id="wasteRows"></div>
              <button class="btn btn-sm" id="addWaste" type="button">＋ 品目を追加</button>
              <div class="field" style="margin-top:16px;max-width:260px">
                <label class="label">畳の枚数 <span class="opt">任意</span></label>
                <div class="input-affix"><input class="input num" type="number" min="0" placeholder="0"><span class="suffix">枚</span></div>
                <span class="hint">畳の予約時のみ入力。未入力の場合は確認依頼となります。</span>
              </div>
            </div>

            <div class="divider"></div>

            <div class="form-section">
              <div class="form-section-title"><span class="n">3</span>車両</div>
              <div class="form-grid">
                <div class="field"><label class="label">車種 <span class="req">必須</span></label>
                  <select class="select" id="fCar"></select></div>
                <div class="field"><label class="label">台数 <span class="req">必須</span></label>
                  <div class="input-affix"><input class="input num" id="fUnits" type="number" min="1" value="1"><span class="suffix">台</span></div>
                  <span class="hint" id="unitsHint"></span></div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="form-section">
              <div class="form-section-title"><span class="n">4</span>特記事項</div>
              <textarea class="textarea" placeholder="例：〇〇と合積み、2回計量を希望。混合廃棄物は内容（品目）を記載。"></textarea>
            </div>
          </div>
        </form>

        <!-- right rail: live 枠 status -->
        <aside class="card" style="position:sticky;top:84px">
          <div class="card-head"><div class="card-title">この枠の空き状況</div></div>
          <div class="card-body">
            <div id="slotSummary"></div>
            <div class="divider"></div>
            <button class="btn btn-primary btn-lg" style="width:100%" id="submit">この内容で登録</button>
            <a class="btn btn-ghost" style="width:100%;margin-top:8px" href="aozora-home.html">キャンセル</a>
            <p class="hint" style="margin-top:12px">登録後、運搬業者へ申請受付の通知が送られます（現行機能と同等）。</p>
          </div>
        </aside>
      </div>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const CARS = ["4tアームロール","4t平ボディ","4tパッカー","4tウイング","4tダンプ","4tユニック","8tアームロール","大型アームロール","大型平ボディ","大型パッカー","大型ウイング","大型ダンプ","大型ユニック","フルトレーラー","セミトレーラー","2tアームロール","2t平ボディ","2tユニック","3tユニック","軽トラ","乗用車","その他"];
  document.getElementById("fCar").innerHTML = `<option value="">選択してください</option>` + CARS.map(c => `<option>${c}</option>`).join("");

  // waste repeater
  const wrap = document.getElementById("wasteRows");
  function wasteRow() {
    const r = document.createElement("div");
    r.className = "repeater-row";
    r.innerHTML = `<select class="select">${DATA.WASTE.map(w=>`<option>${w}</option>`).join("")}</select>
      <button class="btn btn-ghost btn-sm" type="button" data-del aria-label="この行を削除">削除</button>`;
    r.querySelector("[data-del]").addEventListener("click", () => {
      if (wrap.children.length > 1) r.remove();
      else toast("品目は1つ以上必要です", "bad");
    });
    return r;
  }
  wrap.appendChild(wasteRow());
  document.getElementById("addWaste").addEventListener("click", () => wrap.appendChild(wasteRow()));

  // same-as checkbox
  document.getElementById("sameAs").addEventListener("change", e => {
    const site = document.getElementById("fSite");
    if (e.target.checked) { site.value = document.getElementById("fEmitter").value || "（排出事業者と同じ）"; site.disabled = true; }
    else { site.disabled = false; }
  });

  // live 枠 capacity
  const CAP = DATA.CAP;
  function usedFor(dateVal, ampm) {
    const md = dateVal.slice(5).replace(/^0/, "").replace("-0", "/").replace("-", "/"); // 2026-06-25 -> 6/25
    const w = DATA.week.find(x => x.date === md);
    return w ? w[ampm] : 0;
  }
  function refresh() {
    const dateVal = document.getElementById("fDate").value;
    const ampm = document.getElementById("fAmpm").value;
    const units = Math.max(1, parseInt(document.getElementById("fUnits").value || "1", 10));
    const used = usedFor(dateVal, ampm);
    const remain = CAP - used;
    const over = units > remain;
    document.getElementById("slotSummary").innerHTML = `
      <div class="flex between" style="margin-bottom:10px"><span class="td-sub">${dateVal.slice(5)} ${ampm.toUpperCase()}</span>
        ${remain <= 0 ? UI.pill("cancel").replace("取消申請","満枠") : remain<=3 ? `<span class="pill pill-warn"><span class="dot"></span>残りわずか</span>` : `<span class="pill pill-ok"><span class="dot"></span>空きあり</span>`}</div>
      ${UI.gauge("台数 受入残", used, CAP)}
      <div class="hint" style="margin-top:8px">受入上限 <b class="mono">${CAP}台</b> ／ 現在 <b class="mono">${used}台</b> ／ 残 <b class="mono">${Math.max(0,remain)}台</b></div>
      ${over ? `<div class="pill pill-bad" style="margin-top:10px">⚠ 申請台数 ${units}台 が残枠 ${Math.max(0,remain)}台 を超えています</div>` : ""}`;
    const btn = document.getElementById("submit");
    btn.classList.toggle("btn-danger", over); btn.classList.toggle("btn-primary", !over);
    btn.textContent = over ? "残枠超過のまま登録（要確認）" : "この内容で登録";
    document.getElementById("unitsHint").textContent = over ? `残枠 ${Math.max(0,remain)}台に対し超過しています` : `この枠はあと ${Math.max(0,remain)}台 受入可能`;
  }
  ["fDate","fAmpm","fUnits"].forEach(id => document.getElementById(id).addEventListener("input", refresh));
  document.getElementById("submit").addEventListener("click", () => toast("搬入予約を登録しました", "ok"));
  refresh();
})();
</script>
</body>
</html>
