<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予約確定一覧｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<style>
  /* 来場チェック（受入要望 #2） */
  .col-arrive { width:1%; white-space:nowrap; text-align:center; }
  .arrive-box { display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .arrive-box input { width:18px; height:18px; accent-color:var(--brand); cursor:pointer; }
  .tbl tbody tr.is-arrived { background:var(--surface-3); color:var(--muted); }
  .tbl tbody tr.is-arrived:hover { background:var(--surface-3); }
  .tbl tbody tr.is-arrived .td-strong { color:var(--ink-2); }
  .tbl tbody tr.is-arrived .when-date,
  .tbl tbody tr.is-arrived .td-mono { opacity:.72; }
  .tbl tbody tr.is-arrived .pill { opacity:.75; }
  .arrive-count { font-size:12.5px; color:var(--ink-2); font-weight:600; white-space:nowrap; margin-left:4px; padding-left:14px; border-left:1px solid var(--line-strong); }
  .arrive-count b { font-family:var(--mono); color:var(--brand-strong); font-size:14px; }
</style>
</head>
<body>
<div class="layout" data-app="aozora" data-screen="home" data-role="管理者"
     data-company="株式会社あおぞら" data-title="予約確定一覧" data-date="2026-06-24 (水)">
  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-title" id="pgTitle">予約確定一覧</h1>
        <p class="page-sub" id="pgSub">本日の搬入確定分。日付・品目・運搬業者で絞り込めます。</p>
      </div>

      <!-- 今日やること -->
      <a href="aozora-apply.html" class="card" style="display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:18px;border-left:4px solid var(--warn);text-decoration:none">
        <div style="width:40px;height:40px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);display:grid;place-items:center">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="22" height="22"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/></svg></div>
        <div style="flex:1"><div style="font-weight:700">承認待ちの申請が <span class="mono" style="color:var(--warn-ink)">75件</span> あります</div>
          <div class="td-sub">うち確認依頼中 2件・変更申請 1件。クリックで処理キューへ。</div></div>
        <span class="btn btn-warn">申請を処理する →</span>
      </a>

      <div class="stats">
        <div class="stat is-brand"><div class="stat-label">本日 AM 搬入</div><div class="stat-num num">6<small> / 12枠</small></div></div>
        <div class="stat is-brand"><div class="stat-label">本日 PM 搬入</div><div class="stat-num num">4<small> / 12枠</small></div></div>
        <div class="stat is-ok"><div class="stat-label">今週 確定</div><div class="stat-num num">38<small> 件</small></div></div>
        <div class="stat is-warn"><div class="stat-label">承認待ち</div><div class="stat-num num">75<small> 件</small></div></div>
      </div>

      <div class="toolbar">
        <input class="input" type="text" value="2026-06-24" style="max-width:150px" aria-label="日付">
        <select class="select" style="max-width:170px" id="wfilter" aria-label="品目"></select>
        <input class="input" placeholder="運搬業者で検索" style="max-width:190px" aria-label="運搬業者">
        <label class="check"><input type="checkbox"> 承認待ちも表示</label>
        <span class="arrive-count" id="arriveCount"></span>
        <div class="grow"></div>
        <a class="btn" href="aozora-calendar.html">カレンダーで見る</a>
        <a class="btn btn-primary" href="aozora-add.html">新規搬入予約</a>
        <button class="btn" onclick="toast('予約確定一覧を Excel に出力しました','ok')">Excel 出力</button>
      </div>

      <div class="card card-pad">
        <div class="table-wrap">
          <table class="tbl">
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  document.getElementById("wfilter").innerHTML =
    `<option value="">品目（すべて）</option>` + DATA.WASTE.map(w => `<option>${w}</option>`).join("");

  const rowsEl = document.getElementById("rows");
  const arrived = new Set();   // 来場済み（回収では回収済み）の予約ID（受入要望 #2）

  /* 予約種別（受入要望 #1）。carry=持込／collect=回収 */
  const TYPE = window.RESV_TYPE === "collect" ? "collect" : "carry";
  const LIST = TYPE === "collect" ? DATA.collectRes.filter(r => r.status === "fixed") : DATA.confirmed;
  const T = TYPE === "collect"
    ? { title:"回収予約一覧", sub:"確定済みの回収分。希望日時の許容範囲と品目で絞り込めます。",
        col:"回収済", when:"希望日時（許容範囲）", done:"回収済", verb:"回収" }
    : { title:"予約確定一覧", sub:"本日の搬入確定分。日付・品目・運搬業者で絞り込めます。",
        col:"来場",   when:"搬入予定",             done:"来場済", verb:"来場" };

  document.getElementById("pgTitle").textContent = T.title;
  document.getElementById("pgSub").textContent = T.sub;
  document.querySelector(".layout").dataset.title = T.title;
  document.getElementById("thead").innerHTML = `<tr>
      <th class="col-arrive">${T.col}</th>
      <th>${T.when}</th><th>運搬業者 / 排出事業者</th><th>排出事業場</th>
      <th>品目</th><th>車種・台数</th><th>予約者</th><th>状態</th>
    </tr>`;

  // 回収は「いつなら受けられるか」の幅を持つので、1点の日時ではなく範囲として見せる
  function whenCell(r) {
    if (TYPE !== "collect") {
      return `<div class="t-when"><span class="when-date">${r.date.slice(5)}</span>${UI.ampm(r.ampm)}</div>`;
    }
    const span = r.from === r.to ? UI.md(r.from) : `${UI.md(r.from)} 〜 ${UI.md(r.to)}`;
    const detail = r.slots.length ? r.slots.join("・") : DATA.RANGE_LABEL[r.range];
    return `<div class="cell-stack"><span class="td-strong mono">${span}</span>
      <span class="td-sub">${detail}</span></div>`;
  }

  function render() {
    rowsEl.innerHTML = LIST.map(r => {
      const on = arrived.has(r.id);
      return `
    <tr data-id="${r.id}" class="${on ? "is-arrived" : ""}">
      <td class="col-arrive"><label class="arrive-box" title="${T.verb}したらチェック">
        <input type="checkbox" data-arrive="${r.id}" ${on ? "checked" : ""} aria-label="${r.carrier} の${T.verb}">
      </label></td>
      <td>${whenCell(r)}</td>
      <td><div class="cell-stack"><span class="td-strong">${r.carrier}</span><span class="td-sub">${r.emitter}</span></div></td>
      <td>${r.site}</td>
      <td>${UI.waste(r.waste)}</td>
      <td class="td-mono">${r.car} <span class="td-sub">×${r.units}台</span></td>
      <td>${r.by}</td>
      <td>${on ? `<span class="pill pill-neutral"><span class="dot"></span>${T.done}</span>` : UI.pill("fixed")}</td>
    </tr>`;
    }).join("") || `<tr><td colspan="8"><div class="empty"><h3>確定済みの${TYPE === "collect" ? "回収" : "搬入"}予約はありません</h3></div></td></tr>`;
    document.getElementById("arriveCount").innerHTML =
      `${T.verb} <b>${arrived.size}</b> / ${LIST.length}`;
  }

  rowsEl.addEventListener("change", e => {
    const box = e.target.closest("[data-arrive]"); if (!box) return;
    const id = box.dataset.arrive, r = LIST.find(x => x.id === id);
    if (box.checked) { arrived.add(id); toast(`${r.carrier} の${T.verb}を記録しました`, "ok"); }
    else { arrived.delete(id); toast(`${r.carrier} の${T.verb}チェックを外しました`, "default"); }
    render();
  });

  render();
})();
</script>
</body>
</html>
