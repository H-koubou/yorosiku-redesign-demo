<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>基本情報｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="layout" data-app="aozora" data-screen="basic" data-role="管理者"
     data-company="株式会社あおぞら" data-title="基本情報" data-date="2026-06-24 (水)">
  <main class="main"><div class="page">
    <div class="page-head"><h1 class="page-title">基本情報マスター</h1>
      <p class="page-sub">運搬業者・排出事業者を登録。搬入予約登録時に選択候補として表示されます。</p></div>
    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab is-active" data-t="carrier">運搬業者 <span class="count" style="background:var(--neutral)" id="cCarrier">0</span></button>
        <button class="tab" data-t="emitter">排出事業者 <span class="count" style="background:var(--neutral)" id="cEmitter">0</span></button>
      </div>
      <div class="grow"></div>
      <input class="input" placeholder="名称で検索" style="max-width:220px" aria-label="検索">
      <button class="btn btn-primary" id="addBtn">＋ 追加</button>
    </div>
    <div class="card card-pad"><div class="table-wrap"><table class="tbl">
      <thead id="thead"></thead><tbody id="rows"></tbody>
    </table></div></div>
  </div></main>
</div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function () {
  let tab = "carrier";
  document.getElementById("cCarrier").textContent = DATA.carriers.length;
  document.getElementById("cEmitter").textContent = DATA.emitters.length;

  function render() {
    if (tab === "carrier") {
      document.getElementById("thead").innerHTML = `<tr><th>運搬業者名</th><th>担当者</th><th>電話番号</th><th>予約実績</th><th class="col-actions">操作</th></tr>`;
      document.getElementById("rows").innerHTML = DATA.carriers.map((c, i) => `
        <tr><td class="td-strong">${c.name}</td><td>${c.contact}</td><td class="td-mono">${c.tel}</td>
          <td class="td-mono">${c.count} 件</td>
          <td class="col-actions"><a class="btn btn-ghost btn-sm" href="aozora-basic-edit.html?type=carrier&i=${i}">編集</a></td></tr>`).join("");
    } else {
      document.getElementById("thead").innerHTML = `<tr><th>排出事業者名</th><th>電話番号</th><th>予約実績</th><th class="col-actions">操作</th></tr>`;
      document.getElementById("rows").innerHTML = DATA.emitters.map((c, i) => `
        <tr><td class="td-strong">${c.name}</td><td class="td-mono">${c.tel}</td>
          <td class="td-mono">${c.count} 件</td>
          <td class="col-actions"><a class="btn btn-ghost btn-sm" href="aozora-basic-edit.html?type=emitter&i=${i}">編集</a></td></tr>`).join("");
    }
  }
  document.getElementById("tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("is-active"));
    t.classList.add("is-active"); tab = t.dataset.t; render();
  });
  document.getElementById("addBtn").addEventListener("click", () => toast((tab==="carrier"?"運搬業者":"排出事業者")+"の追加へ（デモ）","default"));
  render();
})();
</script>
</body></html>
