<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<title>搬入予約を申請｜あおぞら予ろシク</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/pwa.css">
<style>
  .actionbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:min(440px,100%); z-index:32;
    background:var(--surface); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom,0)); }
  .field { margin-bottom:14px; }
</style>
</head>
<body class="pwa-body">
  <div class="pwa" data-screen="add" data-title="搬入予約を申請" data-sub="サンプル建材株式会社" data-back="hauler-home.html">
    <main class="pwa-content">
      <div class="m-card" style="background:linear-gradient(135deg,#eef7f4,#fff)">
        <div class="flex between" style="margin-bottom:10px"><b id="dayLabel">6月25日</b><span id="dayState"></span></div>
        <div class="flex" style="gap:10px">
          <div style="flex:1"><div class="td-sub">車両 受入残</div><div class="mono" style="font-size:20px;font-weight:800" id="carRemain">—</div></div>
          <div style="flex:1"><div class="td-sub">畳 受入残</div><div class="mono" style="font-size:20px;font-weight:800" id="tatRemain">—</div></div>
        </div>
        <div id="warn"></div>
      </div>

      <div class="m-card">
        <div class="field"><label class="label">予定日 <span class="req">必須</span></label><select class="select" id="fDate"></select></div>
        <div class="field"><label class="label">搬入予定時間 <span class="req">必須</span></label><select class="select" id="fAmpm"><option value="am">AM</option><option value="pm">PM</option></select></div>
      </div>
      <div class="m-card">
        <div class="field"><label class="label">排出事業者 <span class="req">必須</span></label><input class="input" value="みらい建設株式会社"></div>
        <div class="field"><label class="label">排出事業場（工事名）<span class="req">必須</span></label><input class="input" value="みらい建設 解体現場"></div>
        <div class="field"><label class="label">産業廃棄物種類 <span class="req">必須</span></label><select class="select" id="fWaste"></select>
          <button class="btn btn-sm" type="button" style="margin-top:8px" onclick="toast('品目を追加（デモ）','default')">＋ 品目を追加</button></div>
        <div class="field" style="margin-bottom:0"><label class="label">畳の枚数 <span class="opt">畳のみ</span></label>
          <div class="input-affix"><input class="input num" id="fTatami" type="number" min="0" value="0"><span class="suffix">枚</span></div></div>
      </div>
      <div class="m-card">
        <div class="field"><label class="label">車種 <span class="req">必須</span></label><select class="select" id="fCar"></select></div>
        <div class="field"><label class="label">台数 <span class="req">必須</span></label><div class="input-affix"><input class="input num" id="fUnits" type="number" min="1" value="1"><span class="suffix">台</span></div></div>
        <div class="field" style="margin-bottom:0"><label class="label">特記事項 <span class="opt">任意</span></label><textarea class="textarea" placeholder="例：合積み希望、畳破砕品 など"></textarea></div>
      </div>
      <p class="hint" style="text-align:center">申請後、施設の承認をお待ちください。結果は通知とマイ予約でお知らせします。</p>
    </main>
  </div>
  <div class="actionbar"><button class="btn btn-primary btn-lg" style="width:100%" id="submit">この内容で申請する</button></div>

  <script src="assets/data.js"></script>
  <script src="assets/pwa.js"></script>
  <script>
  (function () {
    const CARS = ["大型アームロール","4t平ボディ","4tダンプ","4tアームロール","8tアームロール","大型ダンプ","2tユニック","軽トラ"];
    fWaste.innerHTML = DATA.WASTE.map(w=>`<option>${w}</option>`).join("");
    fCar.innerHTML = `<option value="">選択してください</option>` + CARS.map(c=>`<option>${c}</option>`).join("");
    const open = DATA.monthHauler.filter(x => ["open","am","pm"].includes(x.state));
    const LABEL = { open:"営業日", am:"8:00–12:00", pm:"12:00–16:30" };
    fDate.innerHTML = open.map(x => `<option value="${x.d}">6月${x.d}日（${LABEL[x.state]}）</option>`).join("");
    const pd = new URLSearchParams(location.search).get("d");
    if (pd && open.some(x => x.d == pd)) fDate.value = pd;

    const day = () => open.find(x => x.d == fDate.value) || open[0];
    function refresh() {
      const x = day();
      const units = Math.max(1, parseInt(fUnits.value||"1",10));
      const tat = Math.max(0, parseInt(fTatami.value||"0",10));
      const carTxt = x.car == null ? "∞ 無制限" : x.car + "台";
      dayLabel.textContent = "6月" + x.d + "日";
      dayState.innerHTML = `<span class="pill pill-ok"><span class="dot"></span>${LABEL[x.state]}</span>`;
      carRemain.textContent = carTxt; tatRemain.textContent = x.tatami.toLocaleString() + "枚";
      const carOver = x.car != null && units > x.car, tatOver = tat > x.tatami;
      warn.innerHTML = (carOver?`<div class="pill pill-bad" style="margin-top:10px">⚠ 台数 ${units} が残 ${x.car} を超過</div>`:"")
        + (tatOver?`<div class="pill pill-bad" style="margin-top:8px">⚠ 畳 ${tat}枚 が残 ${x.tatami}枚 を超過</div>`:"");
      const bad = carOver || tatOver;
      submit.classList.toggle("btn-danger", bad); submit.classList.toggle("btn-primary", !bad);
      submit.textContent = bad ? "受入残を超過（要確認）で申請" : "この内容で申請する";
    }
    [fDate,fAmpm,fUnits,fTatami].forEach(e => e.addEventListener("input", refresh));
    submit.addEventListener("click", () => {
      const x = day();
      const date = "2026-06-" + String(x.d).padStart(2, "0");
      const ampm = fAmpm.value.toUpperCase();
      const payload = { carrier: "サンプル建材株式会社", emitter: "みらい建設株式会社", site: "みらい建設 解体現場",
        date, ampm, waste: [fWaste.value], car: fCar.value || "大型アームロール",
        units: Math.max(1, parseInt(fUnits.value || "1", 10)), by: "サンプル建材 山田" };
      if (window.BUS) BUS.post("apply", payload);                 // → 管理コンソールへ即着信＋通知
      toast("搬入予約を申請しました", "ok");
      if (window.pwaNotify) pwaNotify("申請を受け付けました", `6月${x.d}日 ${ampm} の搬入予約を申請しました。施設の承認をお待ちください。`, "hauler-book.html", "request");
      setTimeout(() => location.href = "hauler-book.html", 900);
    });
    refresh();
  })();
  </script>
</body>
</html>
