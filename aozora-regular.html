<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>定期予約｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="layout" data-app="aozora" data-screen="regular" data-role="管理者"
     data-company="株式会社あおぞら" data-title="定期予約" data-date="2026-06-24 (水)">
  <main class="main"><div class="page">
    <div class="page-head flex between">
      <div><h1 class="page-title">定期予約</h1><p class="page-sub">繰り返しの搬入を登録。次回分は自動で申請一覧へ作成されます。</p></div>
      <button class="btn btn-primary" onclick="toast('定期予約の登録へ（デモ）','default')">＋ 定期予約を登録</button>
    </div>
    <div class="card card-pad"><div class="table-wrap"><table class="tbl">
      <thead><tr><th>周期</th><th>時間</th><th>運搬業者 / 排出事業者</th><th>品目</th><th>車種・台数</th><th>次回作成日</th><th>状態</th><th class="col-actions">操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div></div>
  </div></main>
</div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
document.getElementById("rows").innerHTML = DATA.regulars.map(r => `
  <tr>
    <td class="td-strong">${r.rule}</td>
    <td>${UI.ampm(r.ampm)}</td>
    <td><div class="cell-stack"><span class="td-strong">${r.carrier}</span><span class="td-sub">${r.emitter}</span></div></td>
    <td>${UI.waste(r.waste)}</td>
    <td class="td-mono">${r.car} <span class="td-sub">×${r.units}台</span></td>
    <td class="td-mono">${r.next.slice(5)}</td>
    <td><span class="pill pill-ok"><span class="dot"></span>有効</span></td>
    <td class="col-actions"><div class="row-actions">
      <button class="btn btn-ghost btn-sm" onclick="toast('編集（デモ）','default')">編集</button>
      <button class="btn btn-warn btn-sm" onclick="toast('定期予約を停止しました','default')">停止</button></div></td>
  </tr>`).join("");
</script>
</body></html>
