<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2722">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<title>予約カレンダー｜あおぞら予ろシク</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/pwa.css">
<style>
  .mcal { background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-1); }
  .mcal-dow, .mcal-grid { display:grid; grid-template-columns:repeat(7,1fr); }
  .mcal-dow span { padding:8px 0; text-align:center; font-size:10.5px; font-weight:700; color:var(--muted); background:var(--surface-2); }
  .mcal-dow span.sun { color:var(--bad); } .mcal-dow span.sat { color:#2c5f88; }
  .mday { min-height:60px; border-top:1px solid var(--line); border-right:1px solid var(--line); padding:5px 2px 4px; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .mday:nth-child(7n) { border-right:0; }
  .mday.blank { background:var(--surface-2); }
  .mday.closed, .mday.ended { background:var(--surface-2); }
  .mday.open:active { background:var(--brand-soft); }
  .dn { font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink); }
  .mday.closed .dn, .mday.ended .dn { color:var(--muted); }
  .mday.today .dn { background:var(--brand); color:#fff; border-radius:6px; padding:0 5px; }
  .cchip { font-size:9px; font-family:var(--mono); font-weight:800; padding:1px 5px; border-radius:6px; }
  .c-ok { background:var(--ok-soft); color:var(--ok-ink); } .c-low { background:var(--warn-soft); color:var(--warn-ink); }
  .c-no { background:#ececec; color:#9a9a9a; } .c-cl { color:#bbb; font-size:9px; }
  .mine-dot { width:7px; height:7px; border-radius:50%; }
  .legend-m { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); margin-top:12px; justify-content:center; }
  .legend-m span { display:inline-flex; align-items:center; gap:5px; } .legend-m i { width:9px; height:9px; border-radius:3px; }
</style>
</head>
<body class="pwa-body">
  <div class="pwa" data-screen="home" data-title="予約カレンダー" data-sub="サンプル建材株式会社・山田">
    <main class="pwa-content">

      <div class="banner">
        <div class="bi"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" width="20" height="20"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg></div>
        <div class="bt"><div class="t">完全予約制です</div><div class="s">予約のない搬入は受入待機になる場合があります。土曜は 8:00〜11:00。</div></div>
      </div>

      <div class="flex between" style="margin-bottom:10px">
        <b style="font-size:16px">2026年 6月</b>
        <div class="flex" style="gap:6px">
          <button class="ab-btn" style="width:32px;height:32px;background:var(--surface-3);color:var(--ink-2)" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="ab-btn" style="width:32px;height:32px;background:var(--surface-3);color:var(--ink-2)" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>

      <div class="mcal"><div class="mcal-dow" id="dow"></div><div class="mcal-grid" id="grid"></div></div>

      <div class="legend-m">
        <span><i style="background:var(--ok)"></i>空き</span>
        <span><i style="background:var(--warn)"></i>残りわずか</span>
        <span><i style="background:#ececec"></i>満/受付終了</span>
        <span><i style="background:var(--brand)"></i>申請中</span>
      </div>
      <p class="hint" style="text-align:center;margin-top:10px">営業日（緑）をタップして申請できます。数字は車両の受入残数（台・∞=無制限）。</p>
    </main>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/pwa.js"></script>
  <script>
  (function () {
    const dows = ["日","月","火","水","木","金","土"];
    document.getElementById("dow").innerHTML = dows.map((d,i)=>`<span class="${i===0?'sun':''}${i===6?'sat':''}">${d}</span>`).join("");
    const M = {}; DATA.monthHauler.forEach(x => M[x.d] = x);
    const cells = [`<div class="mday blank"></div>`]; // 6/1=月 → 日曜セルを1つ空ける
    for (let d = 1; d <= 30; d++) {
      const x = M[d], open = ["open","am","pm"].includes(x.state);
      let chip = "";
      if (x.state === "closed") chip = `<span class="c-cl">休</span>`;
      else if (x.state === "ended") chip = `<span class="cchip c-no">終</span>`;
      else { const c = x.car; const cls = c==null ? "c-ok" : (c<=10 ? "c-low" : "c-ok"); chip = `<span class="cchip ${cls}">${c==null?"∞":c}</span>`; }
      const mine = x.mine === "change" ? `<span class="mine-dot" style="background:var(--brand)"></span>`
                 : x.mine === "cancel" ? `<span class="mine-dot" style="background:var(--bad)"></span>` : "";
      cells.push(`<div class="mday ${x.state}${x.today?' today':''}" ${open?`data-d="${d}"`:""}>
        <span class="dn">${d}</span>${chip}${mine}</div>`);
    }
    while (cells.length < 35) cells.push(`<div class="mday blank"></div>`);
    document.getElementById("grid").innerHTML = cells.join("");
    document.getElementById("grid").addEventListener("click", e => {
      const c = e.target.closest("[data-d]");
      if (!c) { if (e.target.closest(".mday.ended,.mday.closed")) toast("この日は受付終了・休業日です","bad"); return; }
      location.href = "hauler-add.html?d=" + c.dataset.d;
    });
  })();
  </script>
</body>
</html>
