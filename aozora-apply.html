<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申請一覧｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">

<style>
  /* チャット着信ポップ（受入要望 #4） */
  .chat-pop {
    position:fixed; right:26px; bottom:26px; width:min(360px, calc(100vw - 52px));
    background:var(--surface); border:1px solid var(--line-strong); border-left:4px solid var(--brand);
    border-radius:var(--r-lg); box-shadow:var(--shadow-pop); padding:14px 16px; z-index:70;
    transform:translateY(14px); opacity:0; pointer-events:none; transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s ease;
  }
  .chat-pop.open { transform:translateY(0); opacity:1; pointer-events:auto; }
  .chat-pop .cp-top { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .chat-pop .cp-ico { width:28px; height:28px; border-radius:8px; background:var(--brand-soft); color:var(--brand-ink); display:grid; place-items:center; flex:none; }
  .chat-pop .cp-ico svg { width:16px; height:16px; }
  .chat-pop .cp-ttl { font-size:12px; font-weight:700; color:var(--brand-ink); letter-spacing:.02em; flex:1; }
  .chat-pop .cp-from { font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:3px; }
  .chat-pop .cp-msg { font-size:12.5px; color:var(--ink-2); line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chat-pop .cp-foot { display:flex; gap:8px; margin-top:12px; }
  .chat-pop .cp-foot .btn { flex:1; }
  /* 日付検索（受入要望 #3） */
  .date-q { display:inline-flex; align-items:center; gap:6px; }
  .date-q .input[type="date"] { max-width:168px; }
  .btn-chat { position:relative; padding-inline:9px; overflow:visible; }
  .btn-chat svg { width:15px; height:15px; }
  .btn-chat .unread { position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
                      background:var(--bad); color:#fff; font:700 10px/16px var(--mono); text-align:center; box-shadow:0 0 0 2px var(--surface); }
</style>
</head>
<body>
<div class="layout" data-app="aozora" data-screen="apply" data-role="管理者"
     data-company="株式会社あおぞら" data-title="申請一覧" data-date="2026-06-24 (水)">
  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-title" id="pgTitle">申請一覧</h1>
        <p class="page-sub" id="pgSub">運搬業者からの搬入申請を、処理すべき順に。クリックで詳細・承認。</p>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button class="tab is-active" data-f="all">すべて</button>
          <button class="tab" data-f="request">確認依頼 <span class="count" id="cReq">0</span></button>
          <button class="tab" data-f="change">変更申請 <span class="count" id="cChg">0</span></button>
        </div>
        <div class="grow"></div>
        <span class="date-q">
          <input class="input" type="date" id="dateQ" aria-label="搬入予定日で検索" title="搬入予定日で検索">
          <button class="btn btn-ghost btn-sm" id="dateClear" style="display:none">解除</button>
        </span>
        <input class="input" id="textQ" style="max-width:220px" placeholder="運搬業者・予約者で検索" aria-label="検索">
        <select class="select" style="max-width:170px" aria-label="品目で絞り込み" id="wfilter"></select>
        <a class="btn btn-primary" id="newBtn" href="aozora-add.html"><span style="width:16px;height:16px;display:inline-flex"></span>新規搬入予約</a>
        <button class="btn" id="excelBtn">Excel 出力</button>
      </div>

      <div class="card card-pad">
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th id="thWhen">搬入予定</th><th>状態</th><th>運搬業者 / 排出事業者</th><th>排出事業場</th>
              <th>品目</th><th>車種・台数</th><th>申請者 / 申請日時</th><th class="col-actions">操作</th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- チャット着信ポップ（受入要望 #4） -->
  <aside class="chat-pop" id="chatPop" role="status" aria-live="polite">
    <div class="cp-top">
      <span class="cp-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 01-9 8.4L3 21l1.1-3.6A8.4 8.4 0 1121 11.5z"/></svg></span>
      <span class="cp-ttl">新着メッセージ</span>
      <button class="icon-btn" id="cpClose" aria-label="閉じる">×</button>
    </div>
    <div class="cp-from" id="cpFrom"></div>
    <div class="cp-msg" id="cpMsg"></div>
    <div class="cp-foot">
      <a class="btn btn-primary btn-sm" id="cpOpen" href="aozora-chat.html">チャットを開く</a>
      <button class="btn btn-sm" id="cpLater">あとで</button>
    </div>
  </aside>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  /* 予約種別（受入要望 #1）。carry=持込／collect=回収 */
  const TYPE = window.RESV_TYPE === "collect" ? "collect" : "carry";
  const T = TYPE === "collect"
    ? { title:"回収申請一覧", sub:"運搬業者からの回収依頼を、処理すべき順に。希望日時は「いつなら受けられるか」の幅で届きます。", when:"希望日時（許容範囲）" }
    : { title:"申請一覧",     sub:"運搬業者からの搬入申請を、処理すべき順に。クリックで詳細・承認。",                              when:"搬入予定" };

  document.getElementById("pgTitle").textContent = T.title;
  document.getElementById("pgSub").textContent = T.sub;
  document.getElementById("thWhen").textContent = T.when;
  document.querySelector(".layout").dataset.title = T.title;
  if (TYPE === "collect") {
    const nb = document.getElementById("newBtn");
    nb.href = "aozora-collect-add.html"; nb.lastChild.textContent = "新規回収申込";
  }

  const Q = (TYPE === "collect" ? DATA.collectRes : DATA.applyQueue).map(r => ({ ...r }));
  let filter = "all";

  // 回収は日時が範囲。持込は1点（日付＋AM/PM）
  function whenCell(r) {
    if (TYPE !== "collect") {
      return `<div class="t-when"><span class="when-date">${r.date.slice(5)}</span>${UI.ampm(r.ampm)}</div>`;
    }
    const span = r.from === r.to ? UI.md(r.from) : `${UI.md(r.from)} 〜 ${UI.md(r.to)}`;
    const detail = r.slots.length ? r.slots.join("・") : DATA.RANGE_LABEL[r.range];
    return `<div class="cell-stack"><span class="td-strong mono">${span}</span><span class="td-sub">${detail}</span></div>`;
  }
  function whenText(r) {
    if (TYPE !== "collect") return `${r.date}（${r.ampm}）`;
    const span = r.from === r.to ? UI.md(r.from) : `${UI.md(r.from)} 〜 ${UI.md(r.to)}`;
    return `${span}　${r.slots.length ? r.slots.join("・") : DATA.RANGE_LABEL[r.range]}`;
  }

  const wf = document.getElementById("wfilter");
  wf.innerHTML = `<option value="">品目（すべて）</option>` + DATA.WASTE.map(w => `<option>${w}</option>`).join("");

  function counts() {
    return {
      pending: Q.filter(r => r.status !== "fixed").length,
      request: Q.filter(r => r.status === "request").length,
      change:  Q.filter(r => r.status === "change").length,
      done:    DATA.confirmed.length + Q.filter(r => r.status === "fixed").length,
    };
  }

  function renderStats() {
    const c = counts();
    document.getElementById("stats").innerHTML = `
      <div class="stat is-warn"><div class="stat-label">承認待ち</div><div class="stat-num num">${c.pending}<small> 件</small></div></div>
      <div class="stat is-warn"><div class="stat-label">うち確認依頼中</div><div class="stat-num num">${c.request}<small> 件</small></div></div>
      <div class="stat is-brand"><div class="stat-label">変更申請</div><div class="stat-num num">${c.change}<small> 件</small></div></div>
      <div class="stat is-ok"><div class="stat-label">本日 確定済</div><div class="stat-num num">${c.done}<small> 件</small></div></div>`;
    document.getElementById("cReq").textContent = c.request;
    document.getElementById("cChg").textContent = c.change;
  }

  // 運搬業者に紐づくチャットスレッド（受入要望 #3：申請一覧からチャットへ）
  function threadOf(carrier) { return (DATA.chatThreads || []).find(t => t.carrier === carrier); }
  function chatHref(carrier) { return "aozora-chat.html?carrier=" + encodeURIComponent(carrier); }
  function chatBtn(r) {
    const t = threadOf(r.carrier);
    const un = t && t.unread ? `<span class="unread">${t.unread}</span>` : "";
    return `<button class="btn btn-ghost btn-sm btn-chat" data-act="chat" title="${r.carrier} とのチャットを開く" aria-label="${r.carrier} とのチャットを開く">${ICONS.chat}${un}</button>`;
  }

  function rowHtml(r) {
    const carInfo = `${r.car}<span class="td-sub"> ×${r.units}台${r.tatami ? ` ・畳${r.tatami}枚` : ""}</span>`;
    const dim = r.status === "fixed" ? ' style="opacity:.5"' : "";
    return `<tr data-id="${r.id}"${dim}>
      <td>${whenCell(r)}</td>
      <td>${UI.pill(r.status)}</td>
      <td><div class="cell-stack"><span class="td-strong">${r.carrier}</span><span class="td-sub">${r.emitter}</span></div></td>
      <td>${r.site}</td>
      <td style="max-width:200px">${UI.waste(r.waste)}</td>
      <td class="td-mono">${carInfo}</td>
      <td><div class="cell-stack"><span>${r.by}</span><span class="td-sub mono">${r.at}</span></div></td>
      <td class="col-actions"><div class="row-actions">
        ${r.status === "fixed"
          ? `<span class="pill pill-ok"><span class="dot"></span>承認済</span>`
          : `<button class="btn btn-ok btn-sm" data-act="approve">承認</button>
             <button class="btn btn-warn btn-sm" data-act="req">確認依頼</button>
             <button class="btn btn-ghost btn-sm" data-act="edit">編集</button>`}
        ${chatBtn(r)}
      </div></td>
    </tr>`;
  }

  // 絞り込み（タブ ＋ 搬入予定日 ＋ フリーワード）※日付検索＝受入要望 #3
  const dateEl = document.getElementById("dateQ");
  const textEl = document.getElementById("textQ");
  const dateClear = document.getElementById("dateClear");

  function matches(r) {
    if (filter !== "all" && r.status !== filter) return false;
    if (dateEl.value) {
      // 回収は許容範囲に指定日が含まれるかで判定（受入要望 #1・#3）
      const hit = TYPE === "collect" ? (r.from <= dateEl.value && dateEl.value <= r.to) : (r.date === dateEl.value);
      if (!hit) return false;
    }
    const k = textEl.value.trim().toLowerCase();
    if (k && ![r.carrier, r.emitter, r.site, r.by].join(" ").toLowerCase().includes(k)) return false;
    return true;
  }

  function render() {
    const list = Q.filter(matches);
    const narrowed = !!dateEl.value || !!textEl.value.trim();
    dateClear.style.display = dateEl.value ? "" : "none";
    document.getElementById("rows").innerHTML = list.length
      ? list.map(rowHtml).join("")
      : narrowed
        ? `<tr><td colspan="8"><div class="empty"><div class="empty-ico">${ICONS.search}</div><h3>条件に合う申請がありません</h3><p>${dateEl.value ? dateEl.value + " の申請はありません。" : ""}検索条件を変えてお試しください。</p></div></td></tr>`
        : `<tr><td colspan="8"><div class="empty"><div class="empty-ico">${ICONS.check}</div><h3>未処理の申請はありません</h3><p>このタブの申請はすべて処理済みです。</p></div></td></tr>`;
    renderStats();
  }

  dateEl.addEventListener("change", render);
  textEl.addEventListener("input", render);
  dateClear.addEventListener("click", () => { dateEl.value = ""; render(); });

  function approve(id) {
    const r = Q.find(x => x.id === id); if (!r) return;
    r.status = "fixed";
    render();
    const label = whenText(r), verb = TYPE === "collect" ? "回収" : "搬入";
    toast(`${r.carrier} の ${label} ${verb}を承認しました`, "ok");
    if (TYPE !== "collect" && window.BUS) BUS.post("approved", { carrier: r.carrier, date: r.date, ampm: r.ampm, waste: r.waste, car: r.car, units: r.units }); // → 同一端末の予約者タブへ
    if (window.pushSend) pushSend(`${verb}予約が承認されました`, `${label}・${(r.waste||[]).join("・")} が確定しました。`, "hauler-book.html"); // → 実機(iPhone)へプッシュ
  }

  function detail(r) {
    return `<div class="drawer-head">
        <div style="flex:1"><div class="tb-crumb">搬入申請</div>
          <h2 style="font-size:18px;margin-top:2px">${r.carrier}</h2>
          <div style="margin-top:8px">${UI.pill(r.status)}</div></div>
        <button class="icon-btn" data-close aria-label="閉じる">${ICONS.x}</button>
      </div>
      <div class="drawer-body">
        <dl class="dl">
          <dt>${T.when}</dt><dd class="mono">${whenText(r)}</dd>
          <dt>排出事業者</dt><dd>${r.emitter}</dd>
          <dt>排出事業場</dt><dd>${r.site}</dd>
          <dt>産廃種類</dt><dd>${UI.waste(r.waste)}</dd>
          ${r.tatami ? `<dt>畳の枚数</dt><dd class="mono">${r.tatami} 枚</dd>` : ""}
          <dt>車種・台数</dt><dd class="mono">${r.car} ×${r.units}台</dd>
          <dt>特記事項</dt><dd>${r.note || "—"}</dd>
          <dt>申請者</dt><dd>${r.by}</dd>
          <dt>申請日時</dt><dd class="mono">2026-${r.at}</dd>
        </dl>
        <div class="divider"></div>
        <div class="hint">承認すると運搬業者へ確定通知が送られます（現行機能と同等）。</div>
      </div>
      <div class="drawer-foot">
        ${r.status === "fixed"
          ? `<span class="pill pill-ok" style="align-self:center"><span class="dot"></span>承認済み</span>`
          : `<button class="btn btn-ok" style="flex:1" data-act="approve" data-id="${r.id}">承認する</button>
             <button class="btn btn-warn" data-act="req" data-id="${r.id}">確認依頼</button>
             <a class="btn btn-ghost" href="aozora-apply-edit.html?id=${r.id}">編集</a>`}
        <a class="btn btn-ghost btn-chat" href="${chatHref(r.carrier)}" title="${r.carrier} とのチャットを開く" aria-label="チャットを開く">${ICONS.chat}</a>
      </div>`;
  }

  document.getElementById("rows").addEventListener("click", e => {
    const tr = e.target.closest("tr[data-id]"); if (!tr) return;
    const id = tr.dataset.id, btn = e.target.closest("[data-act]");
    if (btn) {
      e.stopPropagation();
      if (btn.dataset.act === "approve") approve(id);
      else if (btn.dataset.act === "req") toast("確認依頼を運搬業者へ送信しました", "default");
      else if (btn.dataset.act === "chat") location.href = chatHref(Q.find(x => x.id === id).carrier);
      else location.href = "aozora-apply-edit.html?id=" + id;
      return;
    }
    openDrawer(detail(Q.find(x => x.id === id)));
  });

  document.addEventListener("click", e => {
    const b = e.target.closest("#eqDrawer [data-act]"); if (!b) return;
    if (b.dataset.act === "approve") { approve(b.dataset.id); closeDrawer(); }
    else if (b.dataset.act === "req") { toast("確認依頼を送信しました", "default"); closeDrawer(); }
  });

  document.getElementById("tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("is-active"));
    t.classList.add("is-active"); filter = t.dataset.f; render();
  });

  document.getElementById("excelBtn").addEventListener("click", () => toast("申請一覧を Excel に出力しました", "ok"));

  // 予約者アプリからの新着申請を即時反映（app.js が dispatch）
  document.addEventListener("apply-incoming", e => {
    if (TYPE === "collect") return;   // 予約者アプリからの申請は持込のみ
    const p = e.detail;
    Q.unshift({ id: "a" + Date.now(), date: p.date, ampm: p.ampm, carrier: p.carrier, emitter: p.emitter || "—",
      site: p.site || "—", waste: p.waste || [], tatami: p.tatami || null, car: p.car, units: p.units, note: p.note || "", by: p.by || p.carrier, at: "たった今", status: "new" });
    filter = "all";
    document.querySelectorAll("#tabs .tab").forEach(x => x.classList.remove("is-active"));
    const allTab = document.querySelector('#tabs .tab[data-f="all"]'); if (allTab) allTab.classList.add("is-active");
    render();
  });

  // ── チャット着信ポップ（受入要望 #4）────────────────────────────
  const pop = document.getElementById("chatPop");
  let popTimer = null;

  function showChatPop(carrier, text, contact) {
    document.getElementById("cpFrom").textContent = contact ? `${carrier}　${contact}` : carrier;
    document.getElementById("cpMsg").textContent = text;
    document.getElementById("cpOpen").href = chatHref(carrier);
    pop.classList.add("open");
    clearTimeout(popTimer);
    popTimer = setTimeout(hideChatPop, 12000);   // 12秒で自動的に引っ込む
  }
  function hideChatPop() { pop.classList.remove("open"); clearTimeout(popTimer); }

  document.getElementById("cpClose").addEventListener("click", hideChatPop);
  document.getElementById("cpLater").addEventListener("click", hideChatPop);

  // 予約者アプリからの実着信（同一オリジンの他タブ／BUS 経由）
  if (window.BUS) BUS.on("chat-carrier", p => {
    const fallback = (DATA.chatThreads || [])[0] || {};
    showChatPop(p.carrier || fallback.carrier || "運搬業者", p.text || "", p.contact);
    render();   // 行のバッジを更新
  });

  // デモ用：未読のあるスレッドをセッション中1回だけ提示（着信の見え方を確認できるように）
  const demoT = (DATA.chatThreads || []).find(t => t.unread > 0);
  if (demoT && !sessionStorage.getItem("cpDemoShown")) {
    setTimeout(() => {
      const last = demoT.messages[demoT.messages.length - 1];
      showChatPop(demoT.carrier, last ? last.text : "", demoT.contact);
      try { sessionStorage.setItem("cpDemoShown", "1"); } catch (_) {}
    }, 2200);
  }

  render();
})();
</script>
</body>
</html>
