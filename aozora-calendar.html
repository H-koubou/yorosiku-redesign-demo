<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カレンダー（品目予定管理）｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
  /* お知らせ編集 */
  .notice-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:22px; }
  @media (max-width:880px){ .notice-grid { grid-template-columns:1fr; } }
  .rte-bar { display:flex; gap:2px; flex-wrap:wrap; border:1px solid var(--line); border-bottom:0; border-radius:9px 9px 0 0; padding:6px; background:var(--surface-2); }
  .rte-bar button { min-width:30px; height:28px; border:0; background:transparent; border-radius:6px; cursor:pointer; color:var(--ink-2); font-size:13px; font-weight:700; padding:0 6px; }
  .rte-bar button:hover { background:var(--surface-3); }
  .rte-bar .sw { width:18px; height:18px; border-radius:5px; border:1px solid var(--line); padding:0; }
  .rte { border:1px solid var(--line); border-radius:0 0 9px 9px; min-height:150px; max-height:260px; overflow-y:auto; padding:12px 14px; font-size:13px; line-height:1.7; outline:none; background:var(--surface); }
  .rte:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
  .rte p { margin:0 0 6px; } .rte b { font-weight:700; }
  /* 月カレンダー（品目予定管理） */
  .cal-cell { cursor:pointer; transition:background .1s ease, box-shadow .1s ease; min-height:118px; }
  .cal-cell:hover { background:var(--brand-soft); box-shadow:inset 0 0 0 2px var(--brand); }
  .cal-cell.is-blank { background:var(--surface-2); cursor:default; }
  .cal-cell.is-blank:hover { background:var(--surface-2); box-shadow:none; }
  .cal-cell.is-closed { background:var(--surface-2); }
  .cal-cell-top { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .cap-line { display:flex; align-items:center; justify-content:space-between; font-size:11.5px; margin-top:3px; }
  .cap-line .k { color:var(--muted); } .cap-line .v { font-family:var(--mono); font-weight:700; font-variant-numeric:tabular-nums; }
  .cap-line .v.zero { color:var(--bad-ink); }
  .cap-line .v.inf { color:var(--brand-strong); }
  .mini-pill { font-size:10.5px; padding:2px 7px; }
  .closed-tag { font-size:11px; color:var(--muted); font-weight:700; }

  /* まとめ登録のプレビュー（受入要望 #6）：保存前に「どの日に効くか」を見せる */
  .cal-cell.is-preview { box-shadow:inset 0 0 0 2px var(--brand); background:var(--brand-soft); }
  .cal-cell.is-preview:hover { background:var(--brand-soft); }
  .prev-bar { border:1px solid var(--brand); background:var(--brand-soft); border-radius:var(--r); padding:13px 16px; margin-bottom:14px; }
  .prev-bar .pb-head { display:flex; align-items:center; gap:12px; margin-bottom:11px; }
  .prev-bar .pb-ttl { font-size:13.5px; color:var(--brand-ink); }
  .pv-sec { display:flex; gap:14px; padding:8px 0; border-top:1px solid rgba(13,122,100,.22); font-size:12.5px; }
  .pv-sec .pv-h { width:88px; flex:none; font-weight:700; color:var(--brand-ink); font-size:11.5px; padding-top:2px; }
  .pv-sec .pv-b { flex:1; color:var(--ink-2); line-height:1.75; }
  .pv-sec.pv-warn .pv-h { color:var(--warn-ink); }
  .pv-sec.pv-warn .pv-b { color:var(--warn-ink); }
  /* 変更前 → 変更後 の差分 */
  .dif-row { display:flex; align-items:baseline; gap:10px; padding:2px 0; }
  .dif-row .dn { width:120px; flex:none; font-weight:600; color:var(--ink); }
  .dif-row .db { font-family:var(--mono); color:var(--muted); text-decoration:line-through; }
  .dif-row .da { font-family:var(--mono); color:var(--ink); }
  .dif-row .da b { color:var(--brand-strong); }
  .dif-row.is-same .db { text-decoration:none; }
  .dif-row.is-same .da { color:var(--muted); }
  /* 個別に手を入れた日 */
  .cal-cell.is-custom .day-num::after { content:"●"; font-size:7px; color:var(--brand); vertical-align:super; margin-left:3px; }
  /* まとめ登録ドロワー（受入要望 #6） */
  .set-row { border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:9px; background:var(--surface); }
  .set-row.is-off { background:var(--surface-2); }
  .set-row.is-off .set-body { opacity:.4; pointer-events:none; }
  .set-head { display:flex; align-items:center; gap:8px; margin-bottom:0; }
  .set-head .sh-name { font-size:12.5px; font-weight:700; flex:1; }
  .set-head .sh-unit { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .set-body { margin-top:10px; }
  .step-ttl { font-size:11.5px; font-weight:700; color:var(--brand-ink); letter-spacing:.04em; margin:0 0 9px; }
  .lim-field { display:flex; align-items:center; gap:10px; }
  .lim-field .input-affix { flex:1; }
</style>
</head>
<body>
<div class="layout" data-app="aozora" data-screen="calendar" data-role="管理者"
     data-company="株式会社あおぞら" data-title="カレンダー（品目予定管理）" data-date="2026-06-25 (木)">
  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-title">カレンダー（品目予定管理）</h1>
        <p class="page-sub">予約者トップに表示されるお知らせと、各日の営業状態・受入上限を設定します。上限の項目は制限項目マスターで自由に定義できます。</p>
      </div>

      <div class="toolbar">
        <div class="field" style="gap:4px"><label class="label" style="font-size:11px">工場</label>
          <select class="select" id="selFactory" style="min-width:170px"><option>あおぞら 本社工場</option><option>あおぞら 第2工場</option></select></div>
        <div class="field" style="gap:4px"><label class="label" style="font-size:11px">品目グループ</label>
          <select class="select" id="selGroup" style="min-width:170px"><option>畳</option><option>混合廃棄物</option><option>その他品目</option></select></div>
        <div class="grow"></div>
        <a class="btn" href="aozora-limits.html">制限項目を編集</a>
        <button class="btn btn-primary" id="bulkBtn">予定をまとめて登録</button>
        <button class="icon-btn" id="prevM" aria-label="前の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div style="font-weight:700;min-width:118px;text-align:center" id="monthLabel">2026年 6月</div>
        <button class="icon-btn" id="nextM" aria-label="次の月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

      <!-- お知らせ編集（予約者トップに表示） -->
      <div class="notice-grid" id="notices"></div>

      <!-- まとめ登録のプレビュー表示（受入要望 #6） -->
      <div id="prevBar" hidden class="prev-bar">
        <div class="pb-head">
          <b class="pb-ttl">この内容で登録します</b>
          <span class="hint">カレンダー上の緑枠が対象日です</span>
          <div class="grow"></div>
          <button class="btn btn-sm" id="prevCancel">やめる</button>
          <button class="btn btn-primary btn-sm" id="prevApply">登録する</button>
        </div>
        <div id="prevBody"></div>
      </div>

      <!-- 月カレンダー -->
      <div class="cal">
        <div class="cal-grid" id="dowRow"></div>
        <div class="cal-grid" id="monthGrid"></div>
      </div>
      <p class="hint" style="margin-top:12px">日付をクリックすると、その日の<b>営業状態</b>・<b>各制限項目の受入上限</b>を1日分だけ設定できます。曜日や期間でまとめて設定する場合は<b>「予定をまとめて登録」</b>を使ってください。設定内容は予約者のカレンダー・申請画面に反映されます。</p>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const STATE = {
    open:   { label:"営業日",   cls:"pill-ok",      hours:"08:00–16:30" },
    ended:  { label:"受付終了", cls:"pill-neutral", hours:"08:00–16:30" },
    closed: { label:"休業日",   cls:"pill-bad",     hours:"" },
    am:     { label:"午前のみ", cls:"pill-warn",    hours:"08:00–12:00" },
    pm:     { label:"午後のみ", cls:"pill-warn",    hours:"12:00–16:30" },
  };
  const num = n => n == null ? "無制限" : n.toLocaleString("ja-JP");

  /* ---- お知らせ編集（2枠） ---- */
  function rte(key, data) {
    return `<div class="card"><div class="card-head" style="padding:13px 16px"><b class="card-title">${data.label}</b>
        <span class="hint" style="margin-left:auto">予約者トップに表示</span></div>
      <div class="card-body" style="padding:14px 16px">
        <div class="rte-bar" role="toolbar" aria-label="書式">
          <button type="button" data-cmd="bold" title="太字">B</button>
          <button type="button" data-cmd="italic" title="斜体" style="font-style:italic">I</button>
          <button type="button" data-cmd="underline" title="下線" style="text-decoration:underline">U</button>
          <button type="button" class="sw" data-color="#c0392b" title="赤" style="background:#c0392b"></button>
          <button type="button" class="sw" data-color="#14231f" title="黒" style="background:#14231f"></button>
          <button type="button" data-cmd="insertUnorderedList" title="箇条書き">•</button>
        </div>
        <div class="rte" contenteditable="true" data-rte="${key}">${data.html}</div>
        <div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary btn-sm" data-reg="${key}">登録</button></div>
      </div></div>`;
  }
  document.getElementById("notices").innerHTML = rte("updated", DATA.calNotices.updated) + rte("notice", DATA.calNotices.notice);
  document.getElementById("notices").addEventListener("click", e => {
    const fmt = e.target.closest("[data-cmd]"), col = e.target.closest("[data-color]"), reg = e.target.closest("[data-reg]");
    if (fmt || col) {
      const bar = e.target.closest(".card-body"); const ed = bar.querySelector(".rte"); ed.focus();
      if (fmt) document.execCommand(fmt.dataset.cmd, false, null);
      else document.execCommand("foreColor", false, col.dataset.color);
      return;
    }
    if (reg) {
      const key = reg.dataset.reg; const ed = document.querySelector(`.rte[data-rte="${key}"]`);
      DATA.calNotices[key].html = ed.innerHTML;
      toast("お知らせを更新しました（予約者トップに反映）", "ok");
    }
  });

  /* ---- 月カレンダー ---- */
  const dows = ["日","月","火","水","木","金","土"];
  document.getElementById("dowRow").innerHTML = dows.map((d, i) =>
    `<div class="cal-dow${i === 0 ? " sun" : ""}${i === 6 ? " sat" : ""}">${d}</div>`).join("");

  function statePill(s) { const st = STATE[s] || STATE.open; return `<span class="pill ${st.cls} mini-pill">${st.label}</span>`; }
  /* ---- 制限項目は「制限項目マスター」で有効にしたものを動的に扱う（受入要望 #5）---- */
  const activeLimits = () => DATA.limitDefs.filter(l => l.active);
  const itemName = code => { const it = DATA.items.find(x => x.code === code); return it ? it.name : ""; };
  const limVal = (x, id) => x.limits ? x.limits[id] : undefined;
  function setLim(x, id, v) {
    x.limits = x.limits || {};
    x.limits[id] = v;
    if (id === "car") x.car = v;          // 予約者カレンダーが参照する既存フィールドも同期させる
    if (id === "tatami") x.tatami = v;
  }

  function capLines(x) {
    const on = activeLimits(), show = on.slice(0, 3);
    let html = show.map(l => {
      const v = limVal(x, l.id);
      const cls = v == null ? "inf" : v === 0 ? "zero" : "";
      return `<div class="cap-line"><span class="k">${l.name}</span><span class="v ${cls}">${v == null ? "無制限" : num(v) + l.unit}</span></div>`;
    }).join("");
    if (on.length > show.length) html += `<div class="cap-line"><span class="k">ほか ${on.length - show.length} 項目</span><span class="v"></span></div>`;
    return html;
  }
  /* ---- 表示中の月（月送り対応）---- */
  let curY = DATA.TODAY.y, curM = DATA.TODAY.m;
  const MONTH = () => DATA.getMonth(curY, curM);
  const iso = d => `${curY}-${String(curM).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const isoOf = (y, m, d) => `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const dowOf = (y, m, d) => new Date(y, m - 1, d).getDay();

  function renderGrid() {
    const lead = dowOf(curY, curM, 1);          // 日曜始まりの先頭空きセル数
    let cells = "";
    for (let b = 0; b < lead; b++) cells += `<div class="day cal-cell is-blank"></div>`;
    MONTH().forEach(x => {
      const st = STATE[x.state] || STATE.open;
      const isToday = curY === DATA.TODAY.y && curM === DATA.TODAY.m && x.d === DATA.TODAY.d;
      cells += `<div class="day cal-cell is-${x.state}${isToday ? " is-today" : ""}${x.custom ? " is-custom" : ""}" data-d="${x.d}">
        <div class="cal-cell-top"><span class="day-num">${x.d}</span>${statePill(x.state)}</div>
        ${x.state === "closed"
          ? `<div style="margin:auto 0;text-align:center"><span class="closed-tag">休業日</span></div>`
          : `<div style="margin-top:6px">${capLines(x)}${(x.hours || st.hours) ? `<div class="cap-line" style="margin-top:5px"><span class="k">時間</span><span class="v" style="font-size:10.5px">${x.hours || st.hours}</span></div>` : ""}</div>`}
      </div>`;
    });
    document.getElementById("monthGrid").innerHTML = cells;
    document.getElementById("monthLabel").textContent = `${curY}年 ${curM}月`;
    if (pending) pending.days.filter(k => k.startsWith(`${curY}-${String(curM).padStart(2, "0")}`))
      .forEach(k => document.querySelector(`.cal-cell[data-d="${+k.slice(8)}"]`)?.classList.add("is-preview"));
  }
  function goMonth(delta) {
    let m = curM + delta, y = curY;
    if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
    curY = y; curM = m; renderGrid();
  }

  /* ---- 日付クリック → 編集ドロワー ---- */
  function dayDrawer(d) {
    const x = MONTH().find(m => m.d === d); if (!x) return;
    const stOpts = Object.entries(STATE).map(([k, v]) => `<option value="${k}" ${x.state === k ? "selected" : ""}>${v.label}${v.hours ? "（" + v.hours + "）" : ""}</option>`).join("");
    // 有効な制限項目の数だけ入力欄を生成（受入要望 #5）
    const limFields = activeLimits().map(l => {
      const v = limVal(x, l.id), inf = v == null;
      return `<div class="field" style="margin-bottom:12px">
        <label class="label">${l.name}の受入可能残数${l.scope === "item" ? ` <span class="opt">品目：${itemName(l.itemCode)}</span>` : ""}</label>
        <div class="lim-field">
          <div class="input-affix"><input class="input" data-lim="${l.id}" type="number" min="0" value="${inf ? "" : v}" placeholder="${l.def == null ? "" : l.def}"><span class="suffix">${l.unit}</span></div>
          <label class="label" style="white-space:nowrap"><input type="checkbox" data-liminf="${l.id}" ${inf ? "checked" : ""} style="accent-color:var(--brand)"> 無制限</label>
        </div></div>`;
    }).join("") || `<p class="hint">有効な制限項目がありません。<a href="aozora-limits.html">制限項目マスター</a>で追加できます。</p>`;
    openDrawer(`
      <div class="drawer-head"><div style="flex:1"><div class="tb-crumb">品目予定管理 ／ ${curY}年${curM}月${d}日</div>
        <h2 style="font-size:18px;margin-top:2px">この日の設定</h2></div>
        <button class="icon-btn" data-close>${ICONS.x}</button></div>
      <div class="drawer-body">
        <div class="field" style="margin-bottom:16px"><label class="label">営業状態</label>
          <select class="select" id="f-state">${stOpts}</select></div>
        <div class="field" id="hoursRow" style="margin-bottom:16px"><label class="label">営業時間</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input class="input" id="f-h1" type="time" value="${(x.hours || STATE[x.state]?.hours || "08:00–16:30").split("–")[0]}" style="max-width:130px"><span class="hint">〜</span>
            <input class="input" id="f-h2" type="time" value="${(x.hours || STATE[x.state]?.hours || "08:00–16:30").split("–")[1] || "16:30"}" style="max-width:130px"></div></div>
        ${limFields}
        <span class="hint">残数は申請の承認に応じて自動で減ります。ここでは当日の上限を設定します。項目の追加・単位の変更は<a href="aozora-limits.html">制限項目マスター</a>から行えます。</span>
      </div>
      <div class="drawer-foot">
        <button class="btn" style="flex:1" data-close>キャンセル</button>
        <button class="btn btn-primary" style="flex:1" id="saveBtn">保存する</button>
      </div>`);

    const stSel = document.getElementById("f-state"), hoursRow = document.getElementById("hoursRow");
    function sync() {
      const s = stSel.value, closed = s === "closed";
      hoursRow.style.display = closed ? "none" : "";
      if (s === "am") { document.getElementById("f-h1").value = "08:00"; document.getElementById("f-h2").value = "12:00"; }
      else if (s === "pm") { document.getElementById("f-h1").value = "12:00"; document.getElementById("f-h2").value = "16:30"; }
      activeLimits().forEach(l => {
        const inEl = document.querySelector(`[data-lim="${l.id}"]`), infEl = document.querySelector(`[data-liminf="${l.id}"]`);
        if (inEl) inEl.disabled = closed || (infEl && infEl.checked);
      });
    }
    stSel.addEventListener("change", sync);
    document.querySelectorAll("[data-liminf]").forEach(el => el.addEventListener("change", sync));
    sync();

    document.getElementById("saveBtn").addEventListener("click", () => {
      x.state = stSel.value;
      if (x.state !== "closed") {
        x.hours = `${document.getElementById("f-h1").value}–${document.getElementById("f-h2").value}`;
        activeLimits().forEach(l => {
          const inEl = document.querySelector(`[data-lim="${l.id}"]`), infEl = document.querySelector(`[data-liminf="${l.id}"]`);
          if (!inEl) return;
          setLim(x, l.id, (infEl && infEl.checked) ? null : Math.max(0, parseInt(inEl.value || "0", 10)));
        });
      }
      x.custom = true;   // 個別に手当てした日（まとめ登録の上書き警告に使う）
      closeDrawer(); renderGrid(); toast(`${curM}月${d}日の設定を保存しました`, "ok");
    });
  }
  document.getElementById("monthGrid").addEventListener("click", e => {
    const cell = e.target.closest(".cal-cell[data-d]"); if (!cell) return;
    if (pending) { toast("プレビュー中は日付を編集できません。先に登録するか、やめるを選んでください", "default"); return; }
    dayDrawer(+cell.dataset.d);
  });

  /* ---- 予定をまとめて登録（受入要望 #6）--------------------------------
     現行は「繰り返し条件を別々に持つ登録ブロック」が縦に並ぶため、どのルールがどの日に
     効くのかを人が追えず入力ミスの温床になっていた。ここでは
       ① 適用する日（繰り返し＋期間）を1つだけ決める
       ② その日に設定する内容を全部まとめて入れる（触らない項目はチェックを外す＝据え置き）
       ③ 確認は「入力の復唱」ではなく "結果の予告" ＝ 対象日数・変更前→変更後の差分・
          上書きされる既存設定 を出し、カレンダー上にもプレビュー反映してから確定
     という順序に統一している。                                              */
  const DOW_JA = ["日","月","火","水","木","金","土"];
  const REPEATS = [
    { id:"none",     label:"繰り返さない（その日だけ）" },
    { id:"daily",    label:"毎日" },
    { id:"weekly",   label:"毎週 同じ曜日" },
    { id:"weekdays", label:"毎週平日（月〜金）" },
    { id:"weekend",  label:"毎週 土日" },
    { id:"nth",      label:"毎月 第◯◯曜日" },
    { id:"monthEnd", label:"毎月 月末" },
  ];
  const MAX_SPAN = 400;                      // 暴走防止（1年強）
  let pending = null;                        // { days:[ISO], ops:[], excl:bool }

  const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return { y, m, d }; };
  const fmtMD = s => { const { y, m, d } = parseISO(s); return `${m}/${d}(${DOW_JA[dowOf(y, m, d)]})`; };
  const nthOf = d => Math.ceil(d / 7);

  // 期間内の日付を1日ずつ辿り、繰り返し条件に合うものだけを返す（月をまたいでよい）
  function targetDates(rule, fromISO, toISO) {
    const a = parseISO(fromISO), b = parseISO(toISO);
    const start = new Date(a.y, a.m - 1, a.d), end = new Date(b.y, b.m - 1, b.d);
    if (end < start) return [];
    const baseDow = dowOf(a.y, a.m, a.d), baseNth = nthOf(a.d);
    const out = [];
    for (let cur = new Date(start); cur <= end && out.length <= MAX_SPAN; cur.setDate(cur.getDate() + 1)) {
      const y = cur.getFullYear(), m = cur.getMonth() + 1, d = cur.getDate(), w = cur.getDay();
      let hit = false;
      switch (rule) {
        case "daily":    hit = true; break;
        case "weekly":   hit = w === baseDow; break;
        case "weekdays": hit = w >= 1 && w <= 5; break;
        case "weekend":  hit = w === 0 || w === 6; break;
        case "nth":      hit = w === baseDow && nthOf(d) === baseNth; break;
        case "monthEnd": hit = d === DATA.daysInMonth(y, m); break;
        default:         hit = y === a.y && m === a.m && d === a.d; break;
      }
      if (hit) out.push(isoOf(y, m, d));
    }
    return out;
  }

  function bulkDrawer() {
    const limRows = activeLimits().map(l => `
      <div class="set-row is-off" data-set="lim:${l.id}">
        <label class="set-head"><input type="checkbox" data-on style="accent-color:var(--brand)">
          <span class="sh-name">${l.name}の受入上限${l.scope === "item" ? `（品目：${itemName(l.itemCode)}）` : ""}</span>
          <span class="sh-unit">${l.unit}</span></label>
        <div class="set-body"><div class="lim-field">
          <div class="input-affix"><input class="input" data-v type="number" min="0" value="${l.def == null ? "" : l.def}"><span class="suffix">${l.unit}</span></div>
          <label class="label" style="white-space:nowrap"><input type="checkbox" data-inf style="accent-color:var(--brand)"> 無制限</label>
        </div></div>
      </div>`).join("");

    const first = isoOf(curY, curM, 1), last = isoOf(curY, curM, DATA.daysInMonth(curY, curM));
    openDrawer(`
      <div class="drawer-head"><div style="flex:1"><div class="tb-crumb">品目予定管理</div>
        <h2 style="font-size:18px;margin-top:2px">予定をまとめて登録</h2></div>
        <button class="icon-btn" data-close>${ICONS.x}</button></div>
      <div class="drawer-body">
        <p class="step-ttl">① 適用する日</p>
        <div class="field" style="margin-bottom:12px"><label class="label">繰り返し</label>
          <select class="select" id="b-rule">${REPEATS.map(r => `<option value="${r.id}">${r.label}</option>`).join("")}</select></div>
        <div class="flex" style="gap:12px;margin-bottom:8px">
          <div class="field" style="flex:1"><label class="label">開始日 <span class="req">必須</span></label>
            <input class="input" type="date" id="b-from" value="${first}"></div>
          <div class="field" style="flex:1" id="b-toWrap"><label class="label">終了日 <span class="req">必須</span></label>
            <input class="input" type="date" id="b-to" value="${last}"></div>
        </div>
        <p class="hint" id="b-count" style="margin-bottom:18px"></p>

        <div class="divider"></div>
        <p class="step-ttl">② この期間に設定する内容<span class="hint" style="font-weight:400"> — チェックした項目だけが上書きされます</span></p>

        <div class="set-row is-off" data-set="state">
          <label class="set-head"><input type="checkbox" data-on style="accent-color:var(--brand)">
            <span class="sh-name">営業状態</span></label>
          <div class="set-body">
            <select class="select" data-v>${Object.entries(STATE).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join("")}</select>
          </div>
        </div>

        <div class="set-row is-off" data-set="hours">
          <label class="set-head"><input type="checkbox" data-on style="accent-color:var(--brand)">
            <span class="sh-name">営業時間</span></label>
          <div class="set-body" style="display:flex;align-items:center;gap:8px">
            <input class="input" type="time" data-h1 value="08:00" style="max-width:130px"><span class="hint">〜</span>
            <input class="input" type="time" data-h2 value="16:30" style="max-width:130px">
          </div>
        </div>

        <div id="b-lims">${limRows}</div>
        <p class="hint" id="b-closedNote" hidden style="margin-top:8px;color:var(--warn-ink)">休業日を選んでいるため、営業時間と受入上限は設定できません。</p>
        <p class="hint" style="margin-top:10px">制限項目は<a href="aozora-limits.html">制限項目マスター</a>で有効にしたものが並びます。</p>
      </div>
      <div class="drawer-foot">
        <button class="btn" style="flex:1" data-close>キャンセル</button>
        <button class="btn btn-primary" style="flex:1" id="b-preview">③ 内容を確認する</button>
      </div>`);

    const ruleEl = document.getElementById("b-rule"), fromEl = document.getElementById("b-from"), toEl = document.getElementById("b-to");
    const stateRow = document.querySelector('#eqDrawer .set-row[data-set="state"]');

    document.querySelectorAll("#eqDrawer .set-row").forEach(row => {
      row.querySelector("[data-on]").addEventListener("change", e => { row.classList.toggle("is-off", !e.target.checked); syncConflicts(); });
      const inf = row.querySelector("[data-inf]");
      if (inf) inf.addEventListener("change", () => { row.querySelector("[data-v]").disabled = inf.checked; });
    });
    stateRow.querySelector("[data-v]").addEventListener("change", syncConflicts);

    // 矛盾する組み合わせは確認画面ではなく入力時点で選べなくする
    function syncConflicts() {
      const on = stateRow.querySelector("[data-on]").checked;
      const closed = on && stateRow.querySelector("[data-v]").value === "closed";
      document.getElementById("b-closedNote").hidden = !closed;
      ["hours", ...activeLimits().map(l => "lim:" + l.id)].forEach(key => {
        const row = document.querySelector(`#eqDrawer .set-row[data-set="${key}"]`); if (!row) return;
        const box = row.querySelector("[data-on]");
        box.disabled = closed;
        if (closed) { box.checked = false; row.classList.add("is-off"); }
        row.style.opacity = closed ? ".5" : "";
      });
    }

    function refresh() {
      const rule = ruleEl.value;
      document.getElementById("b-toWrap").style.display = rule === "none" ? "none" : "";
      const days = targetDates(rule, fromEl.value, rule === "none" ? fromEl.value : toEl.value);
      const a = parseISO(fromEl.value);
      const dw = DOW_JA[dowOf(a.y, a.m, a.d)];
      const extra = rule === "weekly" ? `（${dw}曜日）` : rule === "nth" ? `（第${nthOf(a.d)}${dw}曜日）` : "";
      const head = days.slice(0, 12).map(fmtMD).join("・");
      document.getElementById("b-count").innerHTML = days.length
        ? `対象：<b>${days.length}日間</b>${extra} — ${head}${days.length > 12 ? ` ほか${days.length - 12}日` : ""}`
        : `<span style="color:var(--bad-ink)">この条件に該当する日がありません</span>`;
    }
    [ruleEl, fromEl, toEl].forEach(el => el.addEventListener("change", refresh));
    refresh(); syncConflicts();

    document.getElementById("b-preview").addEventListener("click", () => {
      const rule = ruleEl.value;
      const days = targetDates(rule, fromEl.value, rule === "none" ? fromEl.value : toEl.value);
      if (!days.length) { toast("該当する日がありません。繰り返しか期間を見直してください", "bad"); return; }
      if (days.length > MAX_SPAN) { toast(`対象が多すぎます（${MAX_SPAN}日まで）。期間を短くしてください`, "bad"); return; }

      const rows = [...document.querySelectorAll("#eqDrawer .set-row")].filter(r => r.querySelector("[data-on]").checked);
      if (!rows.length) { toast("設定する内容を1つ以上チェックしてください", "bad"); return; }

      // 各操作を「見出し・新しい値の表示・現在値の取り出し・適用関数」の形で持つ
      const ops = rows.map(row => {
        const key = row.dataset.set;
        if (key === "state") {
          const v = row.querySelector("[data-v]").value;
          return { name:"営業状態", to:STATE[v].label, cur:x => STATE[x.state]?.label || "—", fn:x => { x.state = v; } };
        }
        if (key === "hours") {
          const h1 = row.querySelector("[data-h1]").value, h2 = row.querySelector("[data-h2]").value;
          return { name:"営業時間", to:`${h1}〜${h2}`,
                   cur:x => (x.hours || STATE[x.state]?.hours || "—").replace("–", "〜"),
                   fn:x => { x.hours = `${h1}–${h2}`; } };
        }
        const id = key.slice(4), l = DATA.limitDefs.find(z => z.id === id);
        const inf = row.querySelector("[data-inf]").checked;
        const v = inf ? null : Math.max(0, parseInt(row.querySelector("[data-v]").value || "0", 10));
        return { name:`${l.name}の上限`, to:inf ? "無制限" : `${v.toLocaleString()}${l.unit}`,
                 cur:x => { const c = limVal(x, id); return c == null ? "無制限" : `${c.toLocaleString()}${l.unit}`; },
                 fn:x => setLim(x, id, v) };
      });

      pending = { days, ops, excl:false };
      closeDrawer(); showPreview();
    });
  }

  /* ---- 確認パネル：入力の復唱ではなく「結果の予告」を出す ---- */
  const recOf = k => DATA.getDay(k);
  const conflicts = () => pending.days.filter(k => recOf(k)?.custom);
  const effective = () => pending.excl ? pending.days.filter(k => !recOf(k)?.custom) : pending.days;

  function diffRows() {
    const days = effective();
    return pending.ops.map(op => {
      const befores = [...new Set(days.map(k => { const x = recOf(k); return x ? op.cur(x) : "—"; }))];
      const before = befores.length === 1 ? befores[0] : "日により異なる";
      const same = befores.length === 1 && befores[0] === op.to;
      return `<div class="dif-row${same ? " is-same" : ""}">
        <span class="dn">${op.name}</span>
        <span class="db">${before}</span>
        <span class="da">${same ? "変更なし" : `→ <b>${op.to}</b>`}</span></div>`;
    }).join("");
  }

  function showPreview() {
    const days = effective(), cf = conflicts();
    document.getElementById("prevBody").innerHTML = `
      <div class="pv-sec"><div class="pv-h">適用先</div>
        <div class="pv-b"><b class="mono">${days.length}日間</b>　${days.slice(0, 14).map(fmtMD).join("・")}${days.length > 14 ? ` ほか${days.length - 14}日` : ""}</div></div>
      <div class="pv-sec"><div class="pv-h">変更内容</div><div class="pv-b">${diffRows()}</div></div>
      ${cf.length ? `<div class="pv-sec pv-warn"><div class="pv-h">ご確認ください</div>
        <div class="pv-b">このうち <b>${cf.length}日間</b> はすでに個別設定があり、上書きされます（${cf.slice(0, 10).map(fmtMD).join("・")}${cf.length > 10 ? " ほか" : ""}）
          <label class="check" style="margin-top:8px"><input type="checkbox" id="pvExcl" ${pending.excl ? "checked" : ""}> 個別設定のある日は除外する</label>
        </div></div>` : ""}`;
    document.getElementById("prevApply").textContent = `${days.length}日間に適用する`;
    document.getElementById("prevApply").disabled = days.length === 0;
    document.getElementById("prevBar").hidden = false;
    document.getElementById("pvExcl")?.addEventListener("change", e => { pending.excl = e.target.checked; showPreview(); });
    renderGrid();
    document.getElementById("prevBar").scrollIntoView({ behavior:"smooth", block:"nearest" });
  }
  function clearPreview() { pending = null; document.getElementById("prevBar").hidden = true; renderGrid(); }

  document.getElementById("bulkBtn").addEventListener("click", bulkDrawer);
  document.getElementById("prevCancel").addEventListener("click", () => { clearPreview(); toast("まとめ登録をキャンセルしました", "default"); });
  document.getElementById("prevApply").addEventListener("click", () => {
    const days = effective(), n = days.length;
    days.forEach(k => { const x = recOf(k); if (x) pending.ops.forEach(o => o.fn(x)); });
    clearPreview();
    toast(`${n}日分の予定を登録しました`, "ok");
  });

  /* ---- 月送り ---- */
  document.getElementById("prevM").addEventListener("click", () => goMonth(-1));
  document.getElementById("nextM").addEventListener("click", () => goMonth(1));
  document.getElementById("selFactory").addEventListener("change", e => toast(e.target.value + " のカレンダーを表示（デモ）", "default"));
  document.getElementById("selGroup").addEventListener("change", e => toast("品目グループ：" + e.target.value + "（デモ）", "default"));

  renderGrid();
})();
</script>
</body>
</html>
