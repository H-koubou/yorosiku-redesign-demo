<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カレンダー｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">

</head>
<body>
<div class="layout" data-app="aozora" data-screen="calendar" data-role="管理者"
     data-company="株式会社あおぞら" data-title="カレンダー" data-date="2026-06-24 (水)">
  <main class="main">
    <div class="page">
      <div class="page-head">
        <h1 class="page-title">搬入カレンダー</h1>
        <p class="page-sub">AM / PM 各枠の受入残数を可視化。満枠はひと目で分かり、ダブルブッキングを防ぎます。</p>
      </div>

      <div class="toolbar">
        <div class="seg" id="viewSeg">
          <button class="is-active" data-v="week">週</button>
          <button data-v="month">月</button>
        </div>
        <button class="icon-btn" aria-label="前の週"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="flex" style="font-weight:700">2026年6月22日 – 28日</div>
        <button class="icon-btn" aria-label="次の週"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg></button>
        <div class="grow"></div>
        <div class="legend">
          <span><i style="background:var(--ok)"></i>空き</span>
          <span><i style="background:var(--warn)"></i>残りわずか</span>
          <span><i style="background:var(--bad)"></i>満枠</span>
        </div>
        <a class="btn btn-primary" href="aozora-add.html">新規搬入予約</a>
      </div>

      <div id="weekView">
        <div class="cal">
          <div class="cal-grid" id="dowRow"></div>
          <div class="cal-grid" id="weekGrid"></div>
        </div>
        <p class="hint" style="margin-top:12px">枠（AM/PM）をクリックすると、その枠の予約一覧と空き状況を確認できます。1枠あたりの受入上限は <b class="mono">12台</b>（工場マスターで設定）。</p>
      </div>

      <div id="monthView" style="display:none">
        <div class="cal"><div class="cal-grid" id="mDow"></div><div class="cal-grid" id="monthGrid"></div></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  const CAP = DATA.CAP;
  const dows = ["月","火","水","木","金","土","日"];

  // --- DOW header ---
  document.getElementById("dowRow").innerHTML = dows.map((d,i) =>
    `<div class="cal-dow${i===5?' sat':''}${i===6?' sun':''}">${d}</div>`).join("");

  // --- Week grid with capacity gauges (the signature) ---
  function slot(label, used) {
    const full = used >= CAP;
    return `<div class="day-slot${full?' full':''}" data-slot="${label}">
      <div class="day-slot-top"><span class="day-slot-label">${label}</span>
        <span class="td-sub mono">${full?'満枠':used+'件'}</span></div>
      ${UI.gauge("台数", used, CAP)}</div>`;
  }
  document.getElementById("weekGrid").innerHTML = DATA.week.map(d => `
    <div class="day${d.today?' is-today':''}">
      <div class="flex between"><span class="day-num">${d.date.split('/')[1]}</span></div>
      ${slot("AM", d.am)}${slot("PM", d.pm)}
    </div>`).join("");

  // --- Slot drawer ---
  document.getElementById("weekGrid").addEventListener("click", e => {
    const s = e.target.closest(".day-slot"); if (!s) return;
    const day = e.target.closest(".day").querySelector(".day-num").textContent;
    const label = s.dataset.slot;
    const used = DATA.week.find(w => w.date.endsWith(day))[label.toLowerCase()];
    const rows = DATA.confirmed.concat(DATA.applyQueue).filter(r => r.ampm === label).slice(0, used ? 3 : 0);
    openDrawer(`<div class="drawer-head"><div style="flex:1"><div class="tb-crumb">6月${day}日 ${label} 枠</div>
        <h2 style="font-size:18px;margin-top:2px">受入状況</h2></div>
        <button class="icon-btn" data-close>${ICONS.x}</button></div>
      <div class="drawer-body">
        <div style="margin-bottom:16px">${UI.gauge("台数 受入残", used, CAP)}</div>
        <div class="form-section-title"><span class="n">${rows.length}</span>この枠の予約</div>
        ${rows.map(r => `<div class="repeater-row" style="grid-template-columns:1fr">
          <div class="cell-stack"><span class="td-strong">${r.carrier}</span>
          <span class="td-sub">${UI.waste(r.waste)} ・ ${r.car} ×${r.units}台</span></div></div>`).join("") ||
          `<p class="hint">この枠の予約はまだありません。</p>`}
      </div>
      <div class="drawer-foot"><a class="btn btn-primary" style="flex:1" href="aozora-add.html">この枠に新規予約</a></div>`);
  });

  // --- Month view (June 2026, Monday start; 6/1 = Mon) ---
  document.getElementById("mDow").innerHTML = document.getElementById("dowRow").innerHTML;
  let cells = "";
  for (let d = 1; d <= 30; d++) {
    const used = ((d * 5) % (CAP + 4)) + (d % 3); // deterministic demo load
    const pct = Math.min(100, Math.round(used / CAP * 100));
    const full = used >= CAP, mid = !full && pct >= 70;
    const today = d === 24;
    cells += `<div class="day${today?' is-today':''}" style="min-height:96px">
      <span class="day-num">${d}</span>
      <div class="gauge${full?' is-full':mid?' is-mid':''}" style="margin-top:auto">
        <div class="gauge-top"><span class="gauge-name">受入</span><span class="gauge-val">${full?'満':used}<small>/${CAP}</small></span></div>
        <div class="gauge-track"><div class="gauge-fill" style="width:${pct}%"></div></div></div></div>`;
  }
  document.getElementById("monthGrid").innerHTML = cells;

  // --- View toggle ---
  document.getElementById("viewSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#viewSeg button").forEach(x => x.classList.remove("is-active"));
    b.classList.add("is-active");
    const week = b.dataset.v === "week";
    document.getElementById("weekView").style.display = week ? "" : "none";
    document.getElementById("monthView").style.display = week ? "none" : "";
  });
})();
</script>
</body>
</html>
