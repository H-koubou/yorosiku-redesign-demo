<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>メールグループ設定｜あおぞら予ろシク（リデザイン提案）</title>
<link rel="stylesheet" href="assets/styles.css">
<meta name="theme-color" content="#0c2722">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
  .list-meta .n { font-family:var(--mono); font-size:12px; color:var(--muted); }
  .row-actions { display:flex; gap:6px; }
  .pick { max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:4px; }
  .pick label { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px; font-size:13px; cursor:pointer; }
  .pick label:hover { background:var(--surface-2); }
  .pick input { width:16px; height:16px; accent-color:var(--brand); }
  .pick .co { font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto; }
</style>
</head>
<body>
<div class="layout" data-app="aozora" data-screen="group" data-role="管理者"
     data-company="株式会社あおぞら" data-title="基本情報 ／ メールグループ設定" data-date="2026-06-25 (木)">
  <main class="main"><div class="page">
    <div class="page-head"><h1 class="page-title">メールグループ設定</h1>
      <p class="page-sub">一斉配信の宛先をまとめたグループを管理。メール作成時に「送信先」として選べます。</p></div>

    <div class="toolbar">
      <input class="input" id="q" placeholder="グループ名で検索" style="max-width:300px;flex:1" aria-label="検索">
      <button class="btn" id="searchBtn">検索</button>
      <div class="grow"></div>
      <span class="list-meta"><span class="n" id="meta"></span></span>
      <button class="btn btn-primary" id="addBtn">＋ 新規追加</button>
    </div>

    <div class="card card-pad"><div class="table-wrap"><table class="tbl">
      <thead><tr><th class="col-actions">操作</th><th>グループ名称</th><th>送信先件数</th><th>備考</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div></div>
  </div></main>
</div>
<script src="assets/data.js"></script><script src="assets/app.js"></script>
<script>
(function () {
  let q = "";
  const filtered = () => { const k = q.trim().toLowerCase(); return k ? DATA.mailGroups.filter(g => g.name.toLowerCase().includes(k)) : DATA.mailGroups; };

  function render() {
    const list = filtered();
    document.getElementById("meta").textContent = `データ数：${DATA.mailGroups.length}`;
    document.getElementById("rows").innerHTML = list.map(g => {
      const i = DATA.mailGroups.indexOf(g);
      return `<tr data-i="${i}">
        <td class="col-actions"><div class="row-actions">
          <button class="btn btn-ghost btn-sm act-edit" data-i="${i}">編集</button>
          <button class="btn btn-ghost btn-sm act-del" data-i="${i}" style="color:var(--bad-ink)">削除</button>
        </div></td>
        <td class="td-strong">${g.name}<div class="td-sub">${(g.members || []).join("、")}</div></td>
        <td class="td-mono">${g.count} 件</td>
        <td>${g.note || "—"}</td>
      </tr>`;
    }).join("") || `<tr><td colspan="4"><div class="empty"><h3>グループが見つかりませんでした</h3><p>「新規追加」から配信グループを作成できます。</p></div></td></tr>`;
  }

  function editDrawer(i) {
    const g = i != null ? DATA.mailGroups[i] : { name:"", count:0, note:"", members:[] };
    const chosen = new Set(g.members || []);
    const picks = DATA.companies.map(c => `<label><input type="checkbox" value="${c.name}" ${chosen.has(c.name) ? "checked" : ""}><span>${c.name}</span><span class="co">${c.code}</span></label>`).join("");
    openDrawer(`
      <div class="drawer-head"><div style="flex:1"><div class="tb-crumb">メールグループ設定</div>
        <h2 style="font-size:18px;margin-top:2px">${i != null ? "グループを編集" : "新規グループ登録"}</h2></div>
        <button class="icon-btn" data-close>${ICONS.x}</button></div>
      <div class="drawer-body">
        <div class="field" style="margin-bottom:16px"><label class="label">グループ名称 <span class="req">必須</span></label>
          <input class="input" id="f-name" value="${g.name}" placeholder="例）本社工場 利用業者"></div>
        <div class="field" style="margin-bottom:16px"><label class="label">送信先 <span class="req">必須</span>
          <span style="margin-left:auto" class="hint">選択中 <b id="cnt">${chosen.size}</b> 件</span></label>
          <div class="pick" id="pick">${picks}</div></div>
        <div class="field"><label class="label">備考</label><textarea class="textarea" id="f-note">${g.note || ""}</textarea></div>
      </div>
      <div class="drawer-foot">
        <button class="btn" style="flex:1" data-close>キャンセル</button>
        <button class="btn btn-primary" style="flex:1" id="saveBtn">${i != null ? "保存する" : "登録する"}</button>
      </div>`);
    const cntEl = document.getElementById("cnt");
    document.getElementById("pick").addEventListener("change", () => { cntEl.textContent = document.querySelectorAll("#pick input:checked").length; });
    document.getElementById("saveBtn").addEventListener("click", () => {
      const name = document.getElementById("f-name").value.trim();
      const picked = [...document.querySelectorAll("#pick input:checked")].map(x => x.value);
      if (!name || !picked.length) { toast("グループ名称と送信先（1件以上）は必須です", "bad"); return; }
      const members = picked.length > 3 ? picked.slice(0, 3).concat(`ほか${picked.length - 3}社`) : picked;
      const rec = { id: g.id || "g" + Date.now(), name, count: picked.length, note:document.getElementById("f-note").value.trim(), members };
      if (i != null) DATA.mailGroups[i] = rec; else DATA.mailGroups.unshift(rec);
      closeDrawer(); render(); toast(i != null ? "グループを保存しました" : "グループを登録しました", "ok");
    });
  }

  document.getElementById("rows").addEventListener("click", e => {
    const ed = e.target.closest(".act-edit"), del = e.target.closest(".act-del"), tr = e.target.closest("tr[data-i]");
    if (del) { const i = +del.dataset.i; if (confirm(`「${DATA.mailGroups[i].name}」を削除しますか？`)) { DATA.mailGroups.splice(i, 1); render(); toast("グループを削除しました", "default"); } return; }
    if (ed) { editDrawer(+ed.dataset.i); return; }
    if (tr) editDrawer(+tr.dataset.i);
  });
  document.getElementById("addBtn").addEventListener("click", () => editDrawer(null));
  document.getElementById("searchBtn").addEventListener("click", () => { q = document.getElementById("q").value; render(); });
  document.getElementById("q").addEventListener("input", e => { q = e.target.value; render(); });
  render();
})();
</script>
</body></html>
